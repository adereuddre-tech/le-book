<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Book — prenez les commandes d'un fonds global macro</title>
<meta name="description" content="Un jeu de gestion : vingt-cinq marchés, huit trimestres, trois concurrents, des investisseurs nerveux et un comité des risques qui vous surveille. Prouvez que ce n'était pas de la chance.">
<meta property="og:title" content="Le Book — un fonds global macro">
<meta property="og:description" content="Vingt-cinq marchés, trois tailles de fonds, huit trimestres, trois concurrents, des sources incertaines et des dépêches qui vous interrompent. Prouvez que ce n'était pas de la chance.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E1725'/%3E%3Crect x='10' y='34' width='8' height='20' fill='%234FA98C'/%3E%3Crect x='22' y='22' width='8' height='32' fill='%23C4576F'/%3E%3Crect x='34' y='14' width='8' height='40' fill='%234FA98C'/%3E%3Crect x='46' y='28' width='8' height='26' fill='%23D9B06A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1725; --panel:#15202F; --panel2:#1A2739; --panel3:#20304628;
  --line:#28374F; --line2:#35496A;
  --txt:#EAE7E0; --dim:#8C9BB2; --dimmer:#61738E;
  --long:#4FA98C; --short:#C4576F; --warn:#DFA45B; --flat:#33445F;
  --eq:#6E9BD1; --rt:#A98BD1; --fx:#4FA9A0; --cm:#C68A4E; --ex:#C46FA8;
  --gold:#D9B06A;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5}
#app{max-width:680px;margin:0 auto;padding:0 14px 100px}
@supports(padding:max(0px)){#app{padding-bottom:max(100px,calc(88px + env(safe-area-inset-bottom)))}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:500;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
em{font-style:italic;color:var(--txt)}

/* splash */
.splash{padding:28px 0 10px}
.spineart.big{height:120px;gap:4px;margin:0 0 26px}
.splash-h1{font-family:var(--serif);font-size:clamp(38px,12vw,64px);line-height:.95;margin:12px 0 0}
.splash-h1 em{color:var(--gold);font-style:italic}
.splash-p{color:var(--dim);font-size:15.5px;max-width:56ch;margin:16px 0 0}
.namebox{border:1px solid var(--gold);border-radius:10px;padding:16px 15px;margin-top:24px;background:linear-gradient(180deg,rgba(217,176,106,.10),rgba(217,176,106,0))}
.namein{width:100%;font-family:var(--serif);font-size:clamp(26px,7.5vw,38px);line-height:1.15;margin:10px 0 4px;background:transparent;border:none;border-bottom:1px solid var(--gold);color:var(--txt);padding:4px 0;outline:none}
.namein::placeholder{color:var(--dimmer)}
.namerow{display:flex;gap:8px;margin-top:8px}
.namerow select{flex:1;font-family:inherit;font-size:14px;background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:6px;padding:9px 8px;min-width:0}
/* ouverture */
.hero{padding:46px 0 8px}
.kicker{font-family:var(--mono);font-size:11.5px;color:var(--dimmer);letter-spacing:.05em}
.hero h1{font-family:var(--serif);font-size:clamp(44px,14vw,74px);line-height:.92;margin:12px 0 0}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--dim);margin:8px 0 0}
.prose{color:var(--dim);max-width:58ch}
.prose p{margin:14px 0 0}
.prose strong{color:var(--txt);font-weight:500}
.spineart{display:flex;gap:3px;align-items:center;height:52px;margin:26px 0 0}
.spineart i{flex:1;display:block;border-radius:1px}
/* courbe de NAV : même dessin à l'accueil, à mi-parcours, à la clôture et au rapport final */
.navc{display:block;width:100%;height:auto}
.navdraw{stroke-dasharray:1600;stroke-dashoffset:1600;animation:navdr 1.6s cubic-bezier(.35,0,.2,1) forwards}
@keyframes navdr{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.navdraw{animation:none;stroke-dashoffset:0}}
.tape{margin:10px -2px 0;padding:6px 8px 2px;border:1px solid var(--line);border-radius:8px;
 background:linear-gradient(180deg,rgba(21,32,47,.55),rgba(21,32,47,0))}
.tapehead{display:flex;justify-content:space-between;align-items:baseline;
 font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--dimmer);margin-bottom:2px}
.tapehead b{font-size:12px}
@media (prefers-reduced-motion:reduce){.tape animate,.tape animateTransform{display:none}}
/* l'événement se découvre une fois le ruban tracé : on voit le marché bouger, puis on
   apprend pourquoi. Sous « mouvement réduit », tout est visible d'emblée. */
.evhold{opacity:0;pointer-events:none;animation:evshow .55s ease-out 3s forwards}
@keyframes evshow{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none;pointer-events:auto}}
@media (prefers-reduced-motion:reduce){.evhold{opacity:1;pointer-events:auto;animation:none}}
/* grand ruban : ce qui attend la fin du tracé. Jamais sur un élément .fade (voir .evhold) */
.thold{opacity:0;pointer-events:none;animation:evshow .5s ease-out 3s forwards}
.skip .thold{animation:none;opacity:1;pointer-events:auto}
.tape.big .tapehead b{font-size:17px}
@media (prefers-reduced-motion:reduce){.thold{opacity:1;pointer-events:auto;animation:none}}
/* bonus : la carte dorée */
#gold{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(4,7,13,.74);animation:gfade .25s ease-out;cursor:pointer}
.gcard{position:relative;overflow:hidden;width:min(320px,86vw);padding:22px 20px 16px;border-radius:14px;text-align:center;
 background:radial-gradient(circle at 50% -10%,rgba(217,176,106,.32),rgba(19,25,37,0) 62%),#131925;border:1.5px solid var(--gold);
 box-shadow:0 0 0 1px rgba(217,176,106,.22),0 18px 60px rgba(0,0,0,.6),0 0 46px rgba(217,176,106,.28);animation:gpop .55s cubic-bezier(.2,1.4,.4,1)}
.gcard::after{content:'';position:absolute;top:-60%;left:-70%;width:40%;height:220%;transform:rotate(22deg);
 background:linear-gradient(90deg,transparent,rgba(255,238,196,.38),transparent);animation:gshine 1.5s .45s ease-out forwards}
.gvis svg{width:92px;height:92px;display:block;margin:0 auto 6px}
.gkick{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--gold)}
.gcard h3{font-family:var(--serif);font-size:25px;line-height:1.1;margin:6px 0 6px;color:#F3EEE4;font-weight:400}
.gcard p{font-size:13.5px;line-height:1.45;color:var(--dim);margin:0}
.ggain{font-family:var(--mono);font-size:14px;color:var(--gold);margin-top:10px;line-height:1.5}
.gtap{font-family:var(--mono);font-size:10px;color:var(--dimmer);margin-top:12px;letter-spacing:.06em}
/* trois paliers : bronze, argent, or */
.gcard{--tc:#D9B06A;--tl:#F3D48C;--trgb:217,176,106}
.gcard.t-bronze{--tc:#C98B55;--tl:#E8B585;--trgb:201,139,85;border-color:#C98B55;box-shadow:0 0 0 1px rgba(201,139,85,.25),0 18px 60px rgba(0,0,0,.6),0 0 32px rgba(201,139,85,.22);
 background:radial-gradient(circle at 50% -10%,rgba(201,139,85,.30),rgba(19,25,37,0) 62%),#131925}
.gcard.t-argent{--tc:#C9D3DE;--tl:#F2F6FA;--trgb:201,211,222;border-color:#C9D3DE;box-shadow:0 0 0 1px rgba(201,211,222,.25),0 18px 60px rgba(0,0,0,.6),0 0 38px rgba(201,211,222,.24);
 background:radial-gradient(circle at 50% -10%,rgba(201,211,222,.28),rgba(19,25,37,0) 62%),#131925}
.gcard.t-or{border-width:2px;box-shadow:0 0 0 1px rgba(217,176,106,.35),0 18px 60px rgba(0,0,0,.6),0 0 60px rgba(217,176,106,.40)}
.gcard .gkick,.gcard .ggain{color:var(--tc)}
.gtier{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#0E1621;background:var(--tc);border-radius:3px;padding:2px 8px;margin-bottom:6px}
@keyframes gpop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gshine{to{left:140%}}
@keyframes gfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){#gold,.gcard,.gcard::after{animation:none}}
.navbox{margin:14px 0 0;padding:10px 10px 7px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,var(--panel),rgba(21,32,47,0))}
.navrow{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10px;color:var(--dimmer);margin-top:3px}
.navcap{font-family:var(--mono);font-size:10px;color:var(--dimmer);letter-spacing:.05em;margin-bottom:5px}
/* mur des vingt-cinq marchés */
.mwall{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.mw{font-style:normal;font-family:var(--mono);font-size:9.5px;text-align:center;padding:9px 1px 10px;border-radius:4px;background:var(--panel);border:1px solid var(--line);color:var(--dimmer);position:relative;overflow:hidden}
.mw::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--c);opacity:.6}
.mw.up{animation:mwp 7s ease-in-out infinite}
.mw.dn{animation:mwn 7s ease-in-out infinite}
@keyframes mwp{0%,70%,100%{color:var(--dimmer);background:var(--panel)}78%,90%{color:var(--long);background:rgba(79,169,140,.14)}}
@keyframes mwn{0%,62%,100%{color:var(--dimmer);background:var(--panel)}70%,86%{color:var(--short);background:rgba(196,87,111,.14)}}
@media (prefers-reduced-motion:reduce){.mw{animation:none}}
/* concurrents de l'accueil */
.crestrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.crestb{padding:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel);line-height:0}
.crestb.on{border-color:var(--gold);background:rgba(217,176,106,.12)}
.rivs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.riv{display:flex;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.riv .ava{width:38px;height:38px}
.riv b{display:block;font-size:12.5px;line-height:1.2}
.riv span{display:block;font-family:var(--mono);font-size:9px;color:var(--dimmer);margin-top:2px}
.isec{font-family:var(--mono);font-size:11px;color:var(--dimmer);letter-spacing:.06em;margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.rules{border-top:1px solid var(--line);margin-top:22px}
.rule{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.rule b{font-family:var(--mono);font-size:11.5px;color:var(--dimmer);font-weight:500;min-width:88px;flex-shrink:0}
.rule span{color:var(--dim);font-size:14px}
.rule span strong{color:var(--txt);font-weight:500}

/* cartes de choix */
.pickgrp{margin-top:26px}
.pickhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line2);padding-bottom:6px}
.hintq{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;margin-left:6px;
 border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);
 font-size:11px;font-weight:600;line-height:1;vertical-align:middle;flex-shrink:0}
.pickhead h2{font-size:16px;font-weight:600}
.pickhead span{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.card{border:none;border-radius:7px;padding:13px 14px 10px;background:transparent;display:block;width:100%;text-align:left}
.cardwrap{border:1px solid var(--line);border-left:3px solid var(--flat);border-radius:7px;margin-top:9px;background:var(--panel);transition:border-color .15s,background .15s}
.cardwrap.sel{border-color:var(--line2);border-left-color:var(--gold);background:var(--panel2)}
.carddet{padding:0 14px 11px}
.carddet summary{font-size:12px;color:var(--dimmer)}
.cardtop{display:flex;gap:11px;align-items:flex-start}
.ico{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(217,176,106,.10)}
.cardwrap.sel .ico{background:rgba(217,176,106,.24)}
.cardttl{min-width:0}
.reco{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:#0B1A14;background:var(--long);padding:2px 7px;border-radius:4px}
.cardwrap.sel .reco{background:#5FBE9E}
.brow .bh b{display:flex;align-items:center;gap:7px}
.bico{font-size:15px}
.commico{font-size:16px;margin-right:6px}
.card .who{font-family:var(--mono);font-size:11px;color:var(--gold);margin-bottom:4px}
.card b{display:block;font-weight:600;font-size:15px;margin-bottom:5px}
.card p{margin:0;color:var(--dim);font-size:13.5px}
.card ul{margin:8px 0 0;padding-left:0;list-style:none}
.card li{font-size:12.5px;color:var(--dim);padding:2px 0 2px 15px;position:relative;font-family:var(--mono)}
.card li::before{content:'▸';position:absolute;left:0;color:var(--dimmer)}
.card li.g{color:var(--long)}.card li.b{color:var(--short)}

.cta{display:block;width:100%;margin:22px 0 0;padding:15px;border-radius:7px;background:var(--txt);color:var(--ink);font-weight:600;font-size:16px;text-align:center}
.cta[disabled]{opacity:.32}
.cta.ghost{background:none;color:var(--txt);border:1px solid var(--line2);font-weight:500;margin-top:9px}
.cta.gold{background:var(--gold);color:#1A1206}
.seedrow{display:flex;gap:8px;align-items:center;margin:20px 0 0;color:var(--dim);font-size:13px}
.seedrow input{font-family:var(--mono);background:var(--panel);border:1px solid var(--line2);color:var(--txt);padding:7px 10px;border-radius:5px;width:106px;font-size:14px}

/* rumeurs & signaux */
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips i,.tcv i{font-style:normal;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;background:var(--panel2);color:var(--dimmer)}
.chips i.up,.tcv i.up{color:var(--long);background:rgba(79,169,140,.14)}
.chips i.dn,.tcv i.dn{color:var(--short);background:rgba(196,87,111,.14)}
.chips i.rel{margin-left:auto;color:var(--dim)}
.chips i.rel.forte{color:var(--gold);background:rgba(217,176,106,.12)}
.chips i.rel.faible{color:var(--dimmer)}
.crestbadge{display:flex;align-items:center;padding:0 2px;line-height:0;flex-shrink:0}
.ft2 .mand{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--dimmer);opacity:.7}
.chips i.sure{color:var(--gold);background:rgba(217,176,106,.16)}
.news .src{overflow-wrap:anywhere}
.news.rum .src{color:var(--gold)}
.news.rum>span{color:var(--txt)}
.tcv{margin-top:5px}
.tcvb{display:flex;gap:4px;align-items:center;width:100%;padding:0}
.tcvb .more{margin-left:auto;font-size:11px;color:var(--dimmer)}
/* palmarès */
.hrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-top:8px}
.hrow.top{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,176,106,.10),rgba(217,176,106,.02))}
.hrk{font-family:var(--mono);font-size:15px;color:var(--dimmer);min-width:18px;text-align:center;flex-shrink:0}
.hrow.top .hrk{color:var(--gold)}
.hmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hmid>b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{font-size:10.5px;color:var(--dimmer);line-height:1.25}
.hval{text-align:right;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.hval>b{font-family:var(--mono);font-size:15px}
.bico{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;margin-right:10px;font-size:19px;overflow:hidden;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1;vertical-align:middle;border-radius:50%;border:1.5px solid rgba(201,168,106,.55);background:radial-gradient(circle at 34% 28%,rgba(201,168,106,.22),rgba(201,168,106,.05) 70%);box-shadow:0 0 0 3px rgba(201,168,106,.07),inset 0 1px 2px rgba(255,255,255,.08)}
.opay{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--panel2)}
.opayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.opayhead b{font-size:14px;color:var(--txt)}
.opayev{font-family:var(--mono);font-size:16px;font-weight:600;white-space:nowrap}
.opayev em{display:block;font-style:normal;font-size:10px;font-weight:400;color:var(--dimmer);text-align:right;letter-spacing:.04em}
.choice.evopt .evs{display:block;color:var(--dim);font-size:12.5px}
.choice .ptab{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:2px 8px;margin-top:9px;padding-top:7px;border-top:1px solid var(--line);font-size:12px;color:var(--txt);align-items:baseline}
.choice .ptab span{font-size:12px;color:var(--txt)}
.choice .ptab .ph{font-size:10.5px;color:var(--dimmer)}
.choice .ptab .pn{text-align:right;font-family:var(--mono);white-space:nowrap}
.gzr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px;padding:1px 0}
.gzr span{color:var(--dim)}
.gzr b{font-family:var(--mono)}
.hintx{background:none;border:0;color:var(--dimmer);font-size:17px;line-height:1;padding:0 2px;cursor:pointer}
.hintx:hover{color:var(--txt)}
.commrow{padding:5px 0;font-size:12.5px;border-top:1px solid var(--line)}
.commrow:first-of-type{border-top:0}
.commrow span{display:block;color:var(--dim);font-size:11.5px;letter-spacing:.02em}
.commrow b{display:block;margin-top:2px;font-family:var(--mono);font-size:13px}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-top:12px}
.feat{border:1px solid var(--line);border-radius:9px;padding:10px 9px;background:var(--panel);text-align:center;opacity:.42}
.feat.on{opacity:1;border-color:var(--gold);background:linear-gradient(180deg,rgba(217,176,106,.13),rgba(217,176,106,.02))}
.feat .fic{display:block;font-size:24px;line-height:1.2;filter:grayscale(1)}
.feat.on .fic{filter:none}
.feat b{display:block;font-size:11.5px;font-weight:600;margin:3px 0 2px;line-height:1.2}
.feat .fd{display:block;font-size:10px;color:var(--dimmer);line-height:1.25}
/* portraits & bandeau */
.ava{width:54px;height:54px;flex-shrink:0;display:block}
.evhead{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.evhead .who{margin:0;line-height:1.25}
.tick{display:flex;align-items:stretch;background:#8E2436;border-radius:5px;overflow:hidden;margin:6px -14px 0;height:26px}
.tlab{background:#fff;color:#8E2436;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:0 8px;display:flex;align-items:center;flex-shrink:0}
.twrap{flex:1;overflow:hidden;position:relative}
.tmove{position:absolute;white-space:nowrap;font-family:var(--mono);font-size:11px;color:#fff;line-height:26px;animation:tk 60s linear infinite;will-change:transform}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tmove{animation:none;left:8px}}
/* phases */
.phase{padding:40px 6px 20px;min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.ptitle{font-family:var(--serif);font-size:clamp(34px,10vw,50px);line-height:1;margin:12px 0 18px}
.plines{list-style:none;padding:0;margin:0}
.plines li{color:var(--dim);font-size:14.5px;padding:8px 0 8px 18px;border-top:1px solid var(--line);position:relative}

.plines b{color:var(--txt);font-weight:500}
.recap{font-family:var(--mono);font-size:11.5px}
/* barre d'état v3 */
.srow{display:flex;gap:6px;margin-top:5px}
.srow:first-child{margin-top:0}
.tile{flex:1;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}

.tile>span b{font-family:var(--mono);color:var(--txt);font-weight:500;flex-shrink:0}
.tile>span b span{margin-left:3px}
.tile>b{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tile .track{display:block;margin-top:3px}
.tile:active{background:var(--panel2)}
.tile.gold{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,176,106,.13),rgba(217,176,106,.03))}

.tile.gold>span{color:var(--gold);opacity:.8}
.fg{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 4px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.fg .fl{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);letter-spacing:.03em;white-space:nowrap}

.tri.up{color:var(--long)}.tri.dn{color:var(--short)}.tri.none{color:var(--flat)}
.fg .ft2{position:relative;display:block;width:100%;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.fg .ft2 i{position:absolute;top:0;bottom:0;border-radius:3px}
.fg .ft2 em{position:absolute;top:-1px;bottom:-1px;width:1px;background:var(--line2)}
.fg .ft2.lin em{width:2px;margin-left:-1px;background:var(--gold,#c9a86a);box-shadow:0 0 3px rgba(201,168,106,.8);z-index:3}

.fg b{font-family:var(--mono);font-size:11px;font-weight:500;white-space:nowrap}
.fg.hot{border-color:var(--line)}
.rowinfo{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);margin-top:5px}
.rowinfo>span:last-child{overflow:hidden;text-overflow:ellipsis}
.rowinfo .fx{letter-spacing:.02em}
.rowinfo .fx b{font-weight:500}
#toast{position:fixed;left:14px;bottom:14px;z-index:60;background:#1F2C40;border:1px solid var(--gold);color:var(--txt);font-family:var(--mono);font-size:11.5px;line-height:1.45;padding:8px 12px;border-radius:7px;max-width:calc(100vw - 28px);width:max-content;opacity:0;transition:opacity .2s;pointer-events:none}

.buy:active{background:rgba(217,176,106,.15)}
.rescard{border:1px solid var(--line2);border-radius:9px;background:var(--panel);padding:14px 15px;margin-top:12px}
.rescard h3{font-family:var(--serif);font-size:23px;margin-bottom:8px}

.rescard p em{color:var(--txt);font-style:normal}
#toast.on{opacity:1;pointer-events:auto}

#modal{display:none;position:fixed;inset:0;z-index:80}
#modal .mback{position:absolute;inset:0;background:rgba(6,10,18,.72)}
#modal .mbox{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:680px;height:94vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-bottom:none;border-radius:12px 12px 0 0;padding:14px 16px 40px;font-size:14.5px}
#modal .mhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}

/* barre d'état */
.status{position:sticky;top:0;z-index:30;background:rgba(14,23,37,.95);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);margin:0 -14px;padding:8px 14px 7px}
.status .l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.gauges{display:flex;gap:9px;margin-top:6px}

.gauge .gl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:3px}

.track{height:3px;background:var(--flat);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;border-radius:2px;transition:width .4s}
/* investisseurs et comité : la lecture centrale du jeu, elle mérite d'être épaisse */
.tile.gauge .track{height:7px;border-radius:4px}
.tile.gauge .track i{border-radius:4px}
.tile.gauge{padding-bottom:7px}
.tile.gauge.moved{box-shadow:0 0 0 1px var(--mv) inset;border-color:var(--mv)}
.tile.gauge.moved>span i{color:var(--mv)}

/* blocs */
.block{margin:22px 0 0}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:11px}

.wire+.wire{margin-top:8px}
.note{color:var(--dim);font-size:12.5px;margin:9px 0 0}
.note em{color:var(--txt);font-style:normal}
summary{cursor:pointer;font-size:13.5px;color:var(--dim)}
summary::marker{color:var(--dimmer)}

.news{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.news:last-child{border-bottom:none;padding-bottom:0}
.news .src{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);min-width:64px;flex-shrink:0}
.news.rum .src{color:var(--gold)}
.news.rum span{color:var(--gold)}

/* budget */
.brow{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:11px 12px;margin-top:9px}
.brow .bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.brow .bh b{font-size:14.5px;font-weight:600}
.brow .bh span{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.brow>p{margin:0 0 8px;font-size:12.5px;color:var(--dim)}
.capb{font-family:var(--mono);font-size:9.5px;color:var(--gold);border:1px solid rgba(214,178,94,.45);border-radius:3px;padding:0 4px;margin-left:6px;white-space:nowrap}
.quitb{display:block;margin:12px auto 0;background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:8px 16px;border-radius:8px;cursor:pointer}
.evtimer.paused{opacity:.45}
.mflag{margin-right:5px;font-size:13px}
.csym{font-family:var(--mono);font-size:12px;color:var(--txt);margin:0 6px 0 2px;font-weight:700}
.xrow{margin:6px 0 2px}
.xv{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.xv .xk{color:var(--dimmer);min-width:52px}.xv b{min-width:48px}
.xv .xs{color:var(--dimmer);white-space:nowrap}
.xbar{position:relative;flex:1;height:10px;min-width:70px}
.xbar em{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#5B6E8C}
.xbar i{position:absolute;top:3px;height:4px;border-radius:2px;background:rgba(159,178,204,.35)}
.xbar b{position:absolute;top:0;width:3px;height:10px;margin-left:-1px;border-radius:1px;min-width:0}
.xbar b.up{background:var(--long)}.xbar b.dn{background:var(--short)}
.xbook{margin:4px 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.tcvb .mine i{font-weight:600}
.tcvb .oth i{opacity:.9}
.tcvb i.cat{color:var(--gold);border:1px solid rgba(214,178,94,.5)}
.carryrk{font-family:var(--mono);font-size:12px;line-height:1.7}
.rules2{margin:8px 0 0 18px;font-size:13.5px;line-height:1.5;color:var(--dim)}.rules2 li{margin-bottom:5px}
.cardb{font-style:normal;margin-left:4px;font-size:11px}
.sgrid{display:flex;gap:6px;margin-top:5px;align-items:stretch}
.sgrid .sl{flex:1.7;display:flex;flex-direction:column;gap:5px;min-width:0}
.sgrid .sl .srow{margin-top:0}
.sgrid .tile{padding:4px 5px}.sgrid .tile b{font-size:13.5px;overflow:visible;text-overflow:clip;white-space:nowrap}.sgrid .tile.gauge>span{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 4px}.sgrid .tile.gauge span i{font-size:11px!important;overflow:visible!important;text-overflow:clip!important;flex:0 0 auto}
.sgrid .tile.gauge{flex:1.45!important}.sgrid .tile.gold{flex:1.35!important}.sgrid .tile.gold span{font-size:10.5px}
.sgrid .tile.cardt{flex:0 0 24px;padding:1px}.sgrid .tile.cardt svg{width:14px;height:19px}
.srow.fcomp{gap:4px}.srow.fcomp .fg{padding:3px 2px 2px}.srow.fcomp .fg .ft2{display:none}
.srow.fcomp .fg .fl{font-size:9px}
.sgrid .fg.rmt{flex:1;min-width:0;padding:0;display:block;position:relative;overflow:hidden}
.sgrid .rmap{position:absolute;inset:0;height:auto}
.sgrid .tile.aum>span.aumv{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:inherit;color:inherit}
.sgrid .tile.aum>span.aumv b{font-family:var(--mono);font-size:15px;font-weight:500}.sgrid .tile.aum>span.aumv b:first-child{color:var(--txt)}
.sgrid .tile.aum>span.aumv em{font-style:normal;font-size:10.5px}
.bkd{display:block;margin-top:4px;font-size:11.5px;color:var(--dim);font-family:var(--mono)}.bkd b{font-weight:600}.bkd>span{display:block}
.rmap .rd{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%}
.rmap .rd.me{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border:1px solid var(--bg,#0b1020)}.rmap .rd.me.hot{border:1.5px solid #D2463C}
.rmap .rl{position:absolute;font-family:var(--mono);font-size:7px;line-height:1;white-space:nowrap}
.rmap .rv{position:absolute;font-family:var(--mono);font-size:10px;font-weight:700;color:#F3EEE4;line-height:1.05;white-space:nowrap}
.rmap .rv small{display:block;font-size:7.5px;font-weight:400;color:var(--dim)}
.rmap .rv.hot{color:#E5675C}
.rmap .gzc{position:absolute;width:0;height:0;margin-left:-3.5px;border:3.5px solid transparent;border-bottom:5px solid #F3EEE4;border-top:0}
.rmap .gzc.v{margin:-3.5px 0 0;border:3.5px solid transparent;border-right:0;border-left:5px solid #F3EEE4}
.crestmini{display:inline-block;vertical-align:-3px;margin-right:4px}.crestmini svg{display:block}
.mbox.redbox{border:2px solid #D2463C;box-shadow:0 0 0 3px rgba(210,70,60,.25)}
.mbox.redbox .mhead h3{color:#E5675C}
.redpop{text-align:center}.redpop svg{display:block;margin:4px auto 10px}.redpop ul{text-align:left}
.tile.cardt{flex:0 0 38px;align-items:center;justify-content:center;padding:4px}
.tile.cardt svg{display:block}
.lvl[disabled],.coll[disabled]{opacity:.25;cursor:not-allowed}
.seg button[disabled]{cursor:not-allowed}
.redflag{border-left:3px solid #D2463C;background:rgba(210,70,60,.08);padding:7px 10px;border-radius:4px;font-size:13px;margin:0 0 10px}
.evcard.xtr{border-color:#D2463C}
.xtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#fff;background:#D2463C;display:inline-block;padding:2px 8px;border-radius:3px;margin-bottom:8px}
.colls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.coll{text-align:left;padding:8px;border-radius:6px;background:var(--panel2);border:1px solid transparent;display:flex;flex-direction:column;gap:2px}
.coll.on{background:var(--panel);border-color:var(--gold)}
.coll b{font-size:13px}.coll span{font-family:var(--mono);font-size:10.5px}.coll .ci{font-size:15px}
.fxa{font-size:11px;font-weight:400}
.tcvb>span{display:contents}
.xline{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin:6px 0 2px}
.xline .xk{color:var(--dimmer);margin-right:4px}
.srcmore{margin-top:8px}.srcmore>summary{font-size:13.5px;color:var(--dim)}
.rowinfo .xk{color:var(--dimmer);font-size:10.5px;margin-right:3px}
.fg.rmt{padding:3px 5px 2px;align-items:stretch}
.rmh{display:flex;justify-content:space-between;gap:4px;font-family:var(--mono);font-size:9.5px;color:var(--dimmer);white-space:nowrap}
.rmh i{font-style:normal}.rmh b{font-size:11px}.rmh b[class=""]{color:var(--txt)}
.rmap{display:block;width:100%;height:64px}
.fxe2{font-size:10.5px;color:var(--dim);width:100%;white-space:normal;line-height:1.35}
.rgrid2{width:100%;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px;display:flex;flex-direction:column;gap:1px}
.rgrid2 .k{color:var(--dimmer);font-size:10px;display:inline-block;min-width:20px}
.rgrid{display:grid;grid-template-columns:1.05fr 1fr 1.15fr 1fr .95fr .95fr;gap:0 6px;margin-top:5px;width:100%;font-family:var(--mono);align-items:baseline}
.rgrid span{font-size:9.5px;color:var(--dimmer);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans,inherit)}
.rgrid div{font-size:11px;white-space:nowrap}.rgrid div b{font-weight:600}.rgrid div i{font-style:normal;color:var(--dimmer);font-size:9.5px;margin-left:2px}
.pos.locked{opacity:.55;padding:6px 0}.pos.locked .top{margin:0}
.rowinfo .fx{white-space:nowrap}.rowinfo .fxe{white-space:nowrap}
.rowinfo{font-size:10px!important}
.stks b{display:inline!important;margin:0!important;font-size:inherit!important}
.commrow b i{font-style:normal}
.fxe b{font-weight:600;margin-right:1px}
.rowinfo .ord{flex-basis:100%;color:var(--dim)}
.stks{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-family:var(--mono);font-size:11.5px;color:var(--dimmer)}.stks em{font-style:normal;font-weight:600}
.evtimer{padding:5px 10px 5px 5px!important}.evtimer .tdial{transform:scale(.72);transform-origin:left center;margin-right:-14px}.evtimer .tlb{font-size:10.5px!important;max-width:120px}
.lvls{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.lvls .lvl b{font-size:15px}.lvls .lvl span{font-size:8.5px;letter-spacing:-.02em}
.lvsel{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 5px}
.lvsel b{font-size:13.5px;color:var(--gold)}
.lvsel span{font-family:var(--mono);font-size:10.5px;color:var(--dimmer)}
.lvef{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.lvl{padding:6px 2px;border-radius:5px;background:var(--panel2);border:1px solid transparent;text-align:center}
.lvl.on{background:var(--panel);border-color:var(--gold)}
.lvl b{display:block;font-family:var(--mono);font-size:12.5px;font-weight:600}
.lvl span{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);white-space:nowrap}
.efl{list-style:none;padding:0;margin:6px 0 0}
.efl li{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:3px 0}
.efl li b{color:var(--txt);font-weight:500}
.budtot{display:flex;justify-content:space-between;font-size:13.5px;padding:10px 0 0;color:var(--dim)}
.budtot b{font-family:var(--mono);color:var(--txt)}

/* book */
.sect{display:flex;align-items:center;gap:8px;margin:16px 0 5px}
.sect i{width:14px;height:2px;border-radius:1px}
.sect span{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em}
.pos{padding:9px 0 10px;border-bottom:1px solid var(--line)}
.pos .top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.pos .sym{font-family:var(--mono);font-weight:600;font-size:13.5px;min-width:46px}
.pos .nm{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pos .sub2{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);margin-bottom:6px}

.seg button.on.zero{background:var(--flat);color:var(--txt)}
.crowd{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:5px;vertical-align:middle}

/* risque */
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;color:var(--dim)}

.fb .fv{font-family:var(--mono);font-size:11px;color:var(--dimmer);min-width:30px;text-align:right}

/* événements */
.evwrap{padding-top:20px}
.evcard{border:1px solid var(--gold);border-radius:9px;padding:17px 15px;background:linear-gradient(180deg,rgba(217,176,106,.09),rgba(217,176,106,0));}
.evcard.bad{border-color:var(--short);background:linear-gradient(180deg,rgba(196,87,111,.10),rgba(196,87,111,0))}

.evtimer{position:fixed;right:12px;bottom:14px;z-index:70;display:none;align-items:center;gap:10px;
 background:rgba(21,32,47,.96);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:12px;
 padding:8px 12px 8px 8px;max-width:min(340px,calc(100vw - 24px));box-shadow:0 6px 22px rgba(0,0,0,.45);
 font-family:var(--mono);font-size:11px;color:var(--dim);animation:fade .25s ease}
.evtimer.on{display:flex}
.tdial{position:relative;width:76px;height:76px;flex-shrink:0;display:block}
.tdial svg{width:76px;height:76px;transform:rotate(-90deg);display:block}
.tdial .ttrack{fill:none;stroke:var(--panel2);stroke-width:6}
.tdial .tfill{stroke:none;transition:fill-opacity .9s linear}
.tdial .tarc{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .4s}
.tdial .tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.02em}
.tdial.pulse{animation:tp 1s ease-in-out infinite}
@keyframes tp{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.evtimer .tlb{font-size:12.5px;color:var(--dim);line-height:1.35;font-weight:500}
.evtimer{border:1.5px solid var(--gold,#c9a86a);transition:border-color .4s,box-shadow .9s linear}
@media (prefers-reduced-motion:reduce){.tdial.pulse{animation:none}.tdial .tarc,.tdial .tfill{transition:none}}
.evcard.bad .who{color:var(--short)}
.evcard h3{font-family:var(--serif);font-size:26px;line-height:1.12;margin-bottom:8px}
.evcard p{color:var(--dim);font-size:14px;margin:0}
.shock{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.shock span{font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:4px;background:var(--panel2);color:var(--dim)}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:7px;padding:12px 13px;margin-top:9px;background:var(--panel2)}
.choice b{display:block;font-weight:500;margin-bottom:2px}
.choice span{color:var(--dim);font-size:12.5px}

/* débriefing */
.pnlhead{padding:22px 0 2px}
.pnlhead .big{font-family:var(--mono);font-size:42px;line-height:1;font-weight:500}
.pnlhead .sub{color:var(--dim);font-size:13.5px;margin-top:7px;max-width:52ch}
.regime{font-family:var(--serif);font-size:25px;margin:2px 0 0}
.attr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.attr .an{color:var(--dim);min-width:0;line-height:1.3}
.attr .av{flex-shrink:0;white-space:nowrap;text-align:right}
.attr .av{font-family:var(--mono);font-size:13px}
.bar2{position:relative;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar2 .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.bar2 i{position:absolute;top:0;bottom:0;border-radius:3px}
.pos-g{color:var(--long)}.neg-g{color:var(--short)}.dim-g{color:var(--dim)}
.gold-g{color:var(--gold)}

table.qt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;margin-top:8px}
table.qt th{text-align:right;color:var(--dimmer);font-weight:500;padding:5px 0;border-bottom:1px solid var(--line);font-size:10.5px}
table.qt th:first-child,table.qt td:first-child{text-align:left}
table.qt{table-layout:auto;width:100%}
table.qt td{text-align:right;padding:6px 0 6px 8px;border-bottom:1px solid var(--line);color:var(--dim);white-space:nowrap;vertical-align:top}
table.qt td:first-child{text-align:left;white-space:normal;line-height:1.3;padding-left:0;padding-right:10px;word-break:normal;overflow-wrap:anywhere}
table.qt th{white-space:nowrap;vertical-align:bottom;padding-left:8px}
table.qt th:first-child{padding-left:0}
table.qt tr.me td{color:var(--txt);background:rgba(217,176,106,.07)}
table.commt{margin-top:8px}
table.commt{table-layout:fixed;width:100%}
table.commt td{font-size:11.5px;padding:4px 0;white-space:nowrap;overflow:hidden;text-align:right;border-bottom:1px solid var(--line)}
table.commt tr:last-child td{border-bottom:none}
table.commt td:first-child{color:var(--dimmer);text-align:left;width:34%}
table.commt td[colspan="2"],table.commt td[colspan="3"]{text-align:left}
table.commt b{font-weight:500}
table.payt{table-layout:fixed;width:100%}
table.payt td,table.payt th{font-size:10.5px;padding:5px 1px;text-align:right;white-space:nowrap}
table.payt th:first-child,table.payt td:first-child{text-align:left;width:27%;white-space:normal;line-height:1.2}
table.payt th{line-height:1.2;font-size:9.5px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:13px}
.cell{background:var(--panel);padding:11px 12px}
.cell .cl{font-size:11px;color:var(--dim)}
.cell .cv{font-family:var(--mono);font-size:19px;margin-top:2px}
.verdict{font-family:var(--serif);font-size:clamp(31px,10vw,50px);line-height:1.02;margin:8px 0 0}
.curve{width:100%;height:132px;margin-top:12px;display:block}
.psr{border-left:2px solid var(--warn);padding:2px 0 2px 13px;margin-top:18px}
.psr p{color:var(--dim);font-size:13.5px;margin:6px 0 0}
.psr .f{font-family:var(--mono);font-size:11.5px;color:var(--dimmer);margin-top:8px;line-height:1.7}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function snapPools(){

/* symboles cités ailleurs que dans hit : clés d'objet et chaînes exactes */
function symsOf(o,acc){
 acc=acc||[];
 if(Array.isArray(o)){o.forEach(v=>symsOf(v,acc));return acc}
 if(o&&typeof o==='object'){for(const k in o){if(k==='hit')continue;if(ALLSYM.has(k))acc.push(k);symsOf(o[k],acc)}return acc}
 if(typeof o==='string'&&ALLSYM.has(o))acc.push(o);
 return acc;
}

let OPENRK=4;
function rankOf(sy){const x=INSTR_ALL.find(z=>z.sym===sy);return x?x.rk:9}
function setUniverse(sizeId,univId){
 snapPools();markStakePos();
 const ncl=NCLASS[univId]||4;
 const cls=CLASSES.slice(0,ncl);
 OPENRK=MKPERCL[sizeId]||4;
 /* tous les rangs : un marché qui s'ouvre en cours de partie n'oblige à rien ré-indexer */
 const sel=INSTR_ALL.filter(x=>cls.includes(x.grp));
 INSTR.length=0;sel.forEach(x=>INSTR.push(x));reindex();
 applyPools();
}
/* Les pools ne citent que des marchés ouverts. Rappelé à chaque ouverture. */
function applyPools(){
 const ok=sy=>{if(IDX[sy]===undefined||rankOf(sy)>OPENRK)return false;const x=INSTR[IDX[sy]];return x.grp!=='Exotiques'||!!(S&&S.exoOpen)};
 /* hit : on élague les marchés fermés, on garde l'événement s'il en reste un */
 POOLS.MACROEV.live.length=0;
 POOLS.MACROEV.all.forEach(e=>{
  const h={};for(const sy in e.hit)if(ok(sy))h[sy]=e.hit[sy];
  if(!Object.keys(h).length)return;
  POOLS.MACROEV.live.push(Object.keys(h).length===Object.keys(e.hit).length?e:Object.assign({},e,{hit:h}));
 });
 /* need / effets : un seul symbole fermé suffit à écarter l'entrée */
 ['TRADER_EXEC','TRADER_MID','STAKE','INCIDENTS','BOARDEV','FEATS'].forEach(nm=>{
  const P=POOLS[nm];if(!P)return;
  P.live.length=0;
  P.all.forEach(e=>{if(symsOf(e).every(ok))P.live.push(e)});
 });

let rng,spare=null,rngState=0;
/* Flux nommés : un canal par usage et par trimestre, dérivé de la graine. Voir la note de
   reprise — c'est ce qui rend les parties appariées réellement appariées. */
function hash32(str,seed){let h=(seed>>>0)^0x9E3779B9;
 for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),2654435761)>>>0;
 h^=h>>>15;h=Math.imul(h,2246822507)>>>0;h^=h>>>13;return h>>>0}
/* Générateur PUR pour le décor : il ne touche pas à rngState, contrairement à mulberry32.
   Y toucher décalerait les flux nommés et casserait l'appariement des campagnes. */
function prng32(a){let s=a|0;return function(){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* Pont brownien géométrique : m points de v0 à v1, texture de cours, extrémités clouées. */
function bridgePts(v0,v1,m,seed,vol){
 const r=prng32(seed),a=Math.log(Math.max(1e-9,v0)),b=Math.log(Math.max(1e-9,v1));
 vol=Math.max(vol,Math.abs(b-a)*0.55/Math.sqrt(Math.max(1,m)));   /* lot 64 : un grand pas reste brownien */
 const raw=[];let w=0;
 for(let i=0;i<m;i++){w+=(r()*2-1)*vol;raw.push(w)}
 const last=raw[m-1]||0,out=[];
 for(let i=1;i<=m;i++)out.push(Math.exp(a+(b-a)*(i/m)+(raw[i-1]-last*(i/m))));
 return out;
}
function reseed(ch,q){rng=mulberry32(hash32(ch+'#'+(q===undefined?(S?S.q:0):q),S?S.seed:0));spare=null}
function mulberry32(a){rngState=a|0;return function(){rngState=rngState+0x6D2B79F5|0;let t=Math.imul(rngState^rngState>>>15,1|rngState);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(){if(spare!==null){const t=spare;spare=null;return t}
 let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();
 const r=Math.sqrt(-2*Math.log(u));spare=r*Math.sin(2*Math.PI*v);return r*Math.cos(2*Math.PI*v)}
function pick(a){return a[Math.floor(rng()*a.length)]}
function drawK(d){let u=rng(),c=0;for(const k in d){c+=d[k];if(u<=c)return k}return Object.keys(d)[0]}
function uni(a,b){return a+rng()*(b-a)}

function weights(k){return k.map((v,i)=>v*U/INSTR[i].sig)}
function notionalBn(ki,i){return ki*U/INSTR[i].sig*S.nav}
/* lot 60 : covariance vue du gérant = facteurs (variance résiduelle EXPVF) + idiosyncrasique
   + bruit d'estimation des indicateurs. Mise en cache par état du bruit. */
let _CE=null,_CEk='';
function covE(){
 const sn=['t','c','v'].map(z=>typeof sigNoise==='function'&&S&&S.bud?sigNoise(z):1);
 let h=N*7919+sn[0]*13+sn[1]*17+sn[2]*19;for(let i=0;i<N;i++){const b=INSTR[i].b;h+=(i+1)*(b[0]*3.1+b[1]*5.3+b[2]*7.7+b[3]*11.9)}
 const key=h;
 if(_CE&&_CEk===key)return _CE;
 const sv=SIGW.t**2*(sn[0]**2+0.1)+SIGW.c**2*(sn[1]**2+0.1)+SIGW.v**2*(sn[2]**2+0.1);
 _CE=[];for(let i=0;i<N;i++){_CE[i]=[];const xi=INSTR[i];for(let j=0;j<N;j++){const xj=INSTR[j];
  let c=0;for(let k=0;k<K;k++)c+=xi.b[k]*xj.b[k];
  if(i===j){const bb=c;_CE[i][j]=xi.sig**2*(EXPVF*bb+Math.max(0,1-bb)+sv)}
  else _CE[i][j]=xi.sig*xj.sig*EXPVF*c}}

}
function pvol(w){const CE=covE();let v=0;for(let i=0;i<N;i++)for(let j=0;j<N;j++)v+=w[i]*w[j]*CE[i][j];return Math.sqrt(Math.max(v,0))}

 const CE=covE();return w.map((wi,i)=>{let s=0;for(let j=0;j<N;j++)s+=CE[i][j]*w[j];return wi*s/sp})}

 for(let k=0;k<K;k++){let e=0;for(let i=0;i<N;i++)e+=w[i]*INSTR[i].sig*INSTR[i].b[k];fv.push(e*e);tot+=e*e}

/* stress de corrélation : les couvertures cessent de couvrir.
   rho* = rho + kappa(1-|rho|)·signe(wi·wj) — augmente la variance quel que soit le sens des paires */
function volStress(w,kap){
 kap=kap===undefined?MGC.kap():kap;
 let v=0;
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const CE=covE(),si=Math.sqrt(CE[i][i]),sj=Math.sqrt(CE[j][j]);
  let rho=i===j?1:CE[i][j]/(si*sj);
  if(i!==j){const sg=w[i]*w[j]>=0?1:-1;rho=rho+kap*(1-Math.abs(rho))*sg}
  v+=w[i]*w[j]*si*sj*rho;
 }
 return Math.sqrt(Math.max(v,0));
}
MGC.kap=function(){return 0.015+0.020*Math.max(0,Math.min(1.5,(S.liq||1)-1))+(S.truth==='crise'?0.010:0)};
/* variance attendue des dépêches du trimestre, estimée sur le vivier, sans rien divulguer */
function evVarExp(w){
 const P=(POOLS.MACROEV&&POOLS.MACROEV.live)||MACROEV;
 if(!P.length)return {v:0,n:0};
 let s2=0;
 for(const e of P){let p=0;for(const sy in e.hit){const i=IDX[sy];if(i!==undefined)p+=w[i]*0.5*e.hit[sy]*INSTR[i].sigQ}s2+=p*p}
 const nev=3.4;
 return {v:s2/P.length*nev*4,n:nev};  /* ×4 : variance trimestrielle ramenée en annuel */
}
function riskShown(w){

 const total=Math.sqrt(st*st+ev.v);
 return {base,stress:st,dcorr:st-base,ev:Math.sqrt(ev.v),nev:ev.n,total,kap:MGC.kap()};
}

/* Échelle générale des coûts d'exécution : fourchette, impact et glissement d'un desk
   discrétionnaire. Un ordre préparé revient à environ 5 pb du notionnel traité, davantage
   sur les marchés étroits (émergents, crypto, volatilité, carbone, fret). */
const TCK=3;
function tcost(dk,i){
 if(Math.abs(dk)<1e-9)return {cost:0,bp:0,bn:0};
 const x=INSTR[i],bn=Math.abs(dk*U/x.sig*S.nav);
 const desk=DESKS.find(d=>d.id===S.desk);
 const pw=desk.impPow||0.5;
 let bp=x.s+x.c*Math.pow(bn,pw)*(pw===0.5?1:Math.pow(bn,0.5-pw)*0+1);
 const Z=SIZES.find(z=>z.id===S.size)||SIZES[1];
 const bnE=bn*(Z.capX||1)*capFactor();
 bp=(x.s+x.c*Math.pow(bnE,pw)*(pw===0.5?1:1.9)*depthMult(x,bn))*TCK;
 let m=EXECM[S.bud.exec]*desk.mult(x)*S.liq*(1+(S.rate-0.03)*4)*S.execPenalty*PROF().tcMult;
 if(S.leak&&Math.abs(S.k[i])>2)m*=1.45;
 if((S.stars||[]).includes(INSTR[i].grp))m*=0.5;   /* lot 70 : recrues gardées jusqu'à la fin, ÷2 sur leur classe (sans cumul) */
 bp*=m;
 const cost=bn*bp*1e-4,spr=Math.min(cost,bn*x.s*TCK*m*1e-4);

}

function rivalCostQ(){return (BUDGET.reduce((a,b)=>a+b.lv[3].bp,0)+DESK().fixed*1e4+16)*1e-4}

  /* sauvegarde d'avant le lot 42 : on rejoue les trimestres déjà joués (le dernier de hist est r) */
  const h=(rv.hist||[]).slice(0,-1);rv.mgr=0;h.forEach(g=>rivalMgrQuarter(rv,g));

 if(e.rivalEv)return {k:'rival',i:e.i,r:S.rivals.findIndex(x=>x.nm===e.rv.nm)};
 if(e.stake)return {k:'stake',t:e.t};

}
function evFromTag(g){
 if(!g)return null;

 if(g.k==='stake'){const e=STAKE.find(x=>x.t===g.t);return e?{trader:true,stake:true,...e}:null}
 if(g.k==='trader'){const e=TRADER_MID.find(x=>x.t===g.t);return e?{trader:true,...e}:null}

 if(sp<0.08&&sp>0.001)flags+=`<div class="flag"><span>Vous facturez ${dec((S.budBp*4/100+2),1)} % de frais annuels pour un book à ${pct(sp)} de volatilité.</span></div>`;
 if(sp<=0.001)flags+=`<div class="flag"><span>Aucune position. Le collatéral rapporte le taux au jour le jour, les frais courent, le comité regarde.</span></div>`;
 if(fmax>0.62)flags+=`<div class="flag"><span>${(fmax*100).toFixed(0)} % de votre variance vient du seul facteur « ${FACT[vd.fv.indexOf(Math.max(...vd.fv))].nm.toLowerCase()} ». Douze lignes, un pari.</span></div>`;
 document.getElementById('risk').innerHTML=`
  <div class="kv"><span>Risque du book · accident de levier</span><b class="${tailP(RS.total)>0?'neg-g':''}">${pct(RS.total)} · ${tailP(RS.total)>0?dec(tailP(RS.total)*100,0)+' %':'aucun'}</b></div>
  <div class="kv"><span>Notionnel brut / net</span><b>${moneyB(gr)} / ${net>=0?'+':'−'}${moneyB(Math.abs(net))}</b></div>
  <div class="kv"><span>Levier brut sur encours</span><b>${dec((gr/S.nav),2)}×</b></div>
  <div class="kv"><span>Marge utilisée · seuil d'appel</span><b class="${MGU>MGC.thr?'neg-g':''}">${(MGU*100).toFixed(0)} % · ${(MGC.thr*100).toFixed(0)} %</b></div>
  <div class="kv"><span>Perte à −2 σ trimestriels</span><b class="neg-g">${sgn(-sp)} · ${moneyB(sp*S.nav)}</b></div>
  ${fb}
  ${top.length?`<div class="kv" style="margin-top:8px"><span>Principaux contributeurs au risque</span><b>${top.map(o=>INSTR[o.i].sym+' '+(o.v/sp*100).toFixed(0)+'%').join(' · ')}</b></div>`:''}
  ${flags}`;
 renderTC();
}
function renderTC(){
 let tot=0,rows='';
 for(let i=0;i<N;i++){
  const d=S.k[i]-S.k0[i];if(Math.abs(d)<1e-9)continue;
  const t=tcost(d,i);tot+=t.cost;
  rows+=`<div class="attr"><span class="an"><span class="num" style="color:var(--txt)">${INSTR[i].sym}</span> <span style="font-family:var(--mono);font-size:11px;color:var(--dimmer)">${S.k0[i]>0?'+':''}${S.k0[i]} → ${S.k[i]>0?'+':''}${S.k[i]} · ${moneyB(t.bn)}</span></span>
   <span class="av neg-g">${dec(t.bp,1)} pb · ${mm(t.cost)}</span></div>`;
 }
 const el=document.getElementById('tc');if(!el)return;
 el.innerHTML=rows||`<p class="note" style="margin:0">Aucun ordre à passer : le book est inchangé, vous ne payez rien.</p>`;
 if(rows)el.innerHTML+=`<div class="kv" style="margin-top:8px"><span>Coût total des ordres</span><b class="neg-g">${mm(tot)} · ${(tot/S.nav*1e4).toFixed(0)} pb de l'encours</b></div>
  <p class="note">Multiplicateur d'exécution appliqué : ×${dec((EXECM[S.bud.exec]*DESK().mult(INSTR[0])*S.liq*(1+(S.rate-0.03)*4)*S.execPenalty*PROF().tcMult),2)} sur les actions (budget desk, organisation, liquidité du régime ${dec(S.liq,2)}, taux ${dec((S.rate*100),1)} %${S.execPenalty>1?', pénalité débauchage':''}).${S.star>=0?` <em>Votre recrutement du trimestre travaille sur ${INSTR[S.star].sym} : coûts divisés par trois sur ce marché.</em>`:''}</p>`;
}
function commitOrders(){
 S.kVal=[...S.k];   /* le book que le comité juge contre sa bande */
 let tot=0;
 for(let i=0;i<N;i++){const d=S.k[i]-S.k0[i];if(Math.abs(d)>1e-9)tot+=tcost(d,i).cost}
 S.pendingTC=tot/S.nav;S.totalTC+=tot;S.phase='events';S.hotFactor=null;S.qLog=[];
 const pv=previewGauge();gauge(pv.lp,pv.rc,`Book validé pour le trimestre — ${pv.why||'sans remarque'}`);
 return tot;
}

<script>

 comm:["Ce que vous annoncez","<p>Vous promettez un rendement <em>et</em> une fourchette de volatilité réalisée. Les deux doivent être tenus : livrer la performance avec le double du risque annoncé compte comme un échec.</p><p>Ne rien promettre coûte peu, mais coûte à coup sûr. Promettre fort rapporte gros et coûte davantage encore si ça casse : c'est le seul endroit du jeu où vous choisissez votre propre asymétrie.</p>"],

function screenExec(){
 hint('exec');
 save('screenExec');
 const orders=[];let tot=0;
 for(let i=0;i<N;i++){const d=S.k[i]-S.k0[i];if(Math.abs(d)>1e-9){const t=tcost(d,i);tot+=t.cost;orders.push({i,d,t})}}
 const av=TRADER_EXEC.filter(e=>!S.usedExec.includes(e.t)&&!(e.who.startsWith('Sœur')&&S.prof!=='syst')
   &&(!e.need||e.need.some(sy=>orders.find(o=>INSTR[o.i].sym===sy)))&&(!e.need3||S.k.some(v=>Math.abs(v)===3)));
 const ev=av.length?pick(av):null;if(ev)S.usedExec.push(ev.t);
 const mult=EXECM[S.bud.exec]*S.liq*(1+(S.rate-0.03)*4)*S.execPenalty*PROF().tcMult;
 /* l'enjeu réel de chaque option, en monnaie, sur la facture d'ouverture du trimestre */
 const stake=c=>{const x=c.e||{};const out=[];let bill=tot;
  if(x.tcMult){
   let sub=0;if(x.tcMultOn){orders.forEach(o=>{if(x.tcMultOn.includes(INSTR[o.i].sym))sub+=o.t.cost})}else sub=tot;
   const d=sub*(x.tcMult-1);bill=tot+d;
   if(Math.abs(d)>=1e-9)out.push(`<span class="stk">ordres <em class="${d<0?'pos-g':'neg-g'}">${d<0?'−':'+'}${mm(Math.abs(d))}</em></span>`);
  }

  return out.length?`<span class="stks">${out.join('')}</span>`:''};
 const lqNm=S.liq>1.5?'très dégradée':S.liq>1.2?'dégradée':S.liq>1.05?'un peu tendue':S.liq<0.92?'excellente':'normale';
 app.innerHTML=statusBar()+`<div class="fade">
  <div class="block"><div class="blockhead"><h2>${orders.length?'Les traders passent vos ordres':'Aucun ordre à passer'}</h2><span class="hint">T${S.q+1} · exécution</span></div>
   ${orders.length?`<div class="kv"><span>Ordres, à votre charge</span><b class="neg-g">${mm(tot)}</b></div>
   <div class="kv"><span>Impact de marché, pour le fonds</span><b class="neg-g">${mm(Math.abs(execImpactAmt(tot,1,S.leakQ)))}</b></div>`

    <p class="note" style="margin:8px 0 0">${orders.length} marché${orders.length>1?'s':''} à travailler · liquidité ${lqNm} (×${dec(S.liq,2)}) · taux au jour le jour ${dec((S.rate*100),1)} % · trésorerie après paiement ${mm(mgrCash())} · ordres ${(tot/S.nav*1e4).toFixed(0)} pb, impact ${(Math.abs(execImpactAmt(tot,1,S.leakQ))/S.nav*1e4).toFixed(0)} pb de l'encours.</p>
    <div class="wire" style="margin-top:8px">${orders.map(o=>`<div class="attr"><span class="an"><span class="num" style="color:${GRPC[INSTR[o.i].grp]}">${INSTR[o.i].sym}</span> <span class="recap" style="color:var(--dimmer)">${S.k0[o.i]>0?'+':''}${S.k0[o.i]} → ${S.k[o.i]>0?'+':''}${S.k[o.i]} · ${moneyB(o.t.bn)}</span></span><span class="av neg-g">${dec(o.t.bp,1)} pb · ${mm(o.t.cost)}</span></div>`).join('')}
    <p class="note">Multiplicateur du trimestre ×${dec(mult,2)} : budget desk ×${dec(EXECM[S.bud.exec],2)}, liquidité ×${dec(S.liq,2)}, taux ×${dec((1+(S.rate-0.03)*4),2)}, profil ×${dec(PROF().tcMult,2)}${S.execPenalty!==1?`, débauchage ×${dec(S.execPenalty,2)}`:''}.${S.star>=0?` Recrue du trimestre sur ${INSTR[S.star].sym} : ÷3.`:''}</p></div></details>`:''}
  </div>
  ${ev?`<div class="evwrap" style="padding-top:14px"><div class="evcard">${evHead(ev.who,'trader')}<h3>${ev.t}</h3><p>${ev.p}</p></div>
   ${ev.ch.map((c,i)=>{const mg=((c.e&&c.e.mgrM)||0)*S.aum0/0.1,ko=mg<0&&(-mg/1000)>mgrCash();
     return `<button class="choice" data-i="${i}"${ko?' disabled title="Trésorerie insuffisante"':''}><b>${c.b}</b><span>${fxTxt(c.s,c.e)}${stake(c)}${bkPrev(c.e,'exec')}${ko?' <b class="neg-g">hors trésorerie</b>':''}</span></button>`}).join('')}</div>`
   :`<button class="cta" id="go2">Lancer le trimestre</button>`}
 </div>`;
 /* sans anecdote, le fonds paie quand même l'impact d'une exécution standard */
 const done=()=>{S.totalTC+=(S.pendingTC*S.nav)-tot;
  if(!ev){const im=execImpactAmt(S.pendingTC*S.nav,1,S.leakQ);if(im)execSlip(im,'Impact')}
  phaseLive()};
 if(ev&&ev.ch)ev.ch.forEach(c=>{delete c.e._hit});
 if(!ev){document.getElementById('go2').onclick=done;return}
 setTimeout(()=>armTimer(()=>{const bs=app.querySelectorAll('.choice');if(bs.length)bs[bs.length-1].click()}),0);
 app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
  const ch=ev.ch[+b.dataset.i],e=ch.e;let msg=[];const navB0=S.nav;
  if(e.tcMult){let sub=0;
   if(e.tcMultOn){orders.forEach(o=>{if(e.tcMultOn.includes(INSTR[o.i].sym))sub+=o.t.cost})}

   e._m=m}

  {const bill=S.pendingTC*S.nav,im=execImpactAmt(bill,e._m||e.tcMult,e.leakQ);

   else if(e.safePnl){S.nav*=(1+e.safePnl);S.qEvM+=e.safePnl*navB0;e._hit=true;msg.push(e.safeTxt)}}
  if(e.invert){const i=IDX[e.invert];S.k[i]=-S.k[i];msg.push(`Position sur ${e.invert} inversée pour le trimestre.`)}
  if(e.cap2){for(let i=0;i<N;i++)if(Math.abs(S.k[i])===3){const d=S.k[i]>0?-1:1;const t=tcost(d,i);S.k[i]+=d;S.pendingTC-=t.cost*0.8/S.nav;msg.push(`${INSTR[i].sym} ramené à ${S.k[i]>0?'+':''}${S.k[i]}.`)}}
  if(e.leakQ)S.leakQ=true;
  if(e.poach)S.poachBoost+=e.poach;
  if(e.cash){S.nav*=(1+e.cash);S.qEvM+=e.cash*navB0;msg.push(`Encours du fonds ${sgn(e.cash,1)}.`)}
  if(e.halfOn){const arr=Array.isArray(e.halfOn)?e.halfOn:[e.halfOn];arr.forEach(sy=>{const i=IDX[sy];const nk=Math.trunc(S.k[i]/2);if(nk!==S.k[i]){const t=tcost(nk-S.k[i],i);S.pendingTC-=t.cost*0.7/S.nav;S.k[i]=nk;msg.push(`${sy} ramené à ${nk>0?'+':''}${nk}.`)}})}
  if(e.cutTop1){const w=weights(S.k),rc=riskContrib(w);const o=rc.map((v,i)=>({v:Math.abs(v),i})).sort((a,b)=>b.v-a.v)[0];if(o&&S.k[o.i]!==0){const d=-Math.sign(S.k[o.i]);const t=tcost(d,o.i);S.k[o.i]+=d;S.pendingTC-=t.cost*0.8/S.nav;msg.push(`${INSTR[o.i].sym} ramené à ${S.k[o.i]>0?'+':''}${S.k[o.i]}.`)}}
  if(e.scaleAll){for(let i=0;i<N;i++){const nk=Math.round(S.k[i]*e.scaleAll);if(nk!==S.k[i]){S.k[i]=nk;msg.push(`${INSTR[i].sym} → ${nk>0?'+':''}${nk}.`)}}}
  if(e.randAdd){for(let n=0;n<e.randAdd;n++){const i=Math.floor(rng()*N);const d=rng()<0.5?-1:1;const nk=clampK(i,S.k[i]+d);if(nk!==S.k[i]){S.k[i]=nk;msg.push(`${INSTR[i].sym} → ${nk>0?'+':''}${nk} (position héritée).`)}}}
  if(e.kAddAbsE){const i=IDX[e.kAddAbsE[0]];const nk=clampK(i,S.k[i]+e.kAddAbsE[1]);if(nk!==S.k[i]){const t=tcost(nk-S.k[i],i);S.pendingTC+=t.cost/S.nav;S.k[i]=nk;msg.push(`${e.kAddAbsE[0]} → ${nk>0?'+':''}${nk} (${mm(t.cost)}).`)}}
  if(e.risk&&!e._hit)msg.push(e.safeTxt||"Le marché n'a pas bougé pendant l'exécution.");

  const g2=(e.rc||e.lp)?gauge(e.lp||0,e.rc||0,`${ev.who.split(' ·')[0]} — ${ch.b}`):{lp:0,rc:0};

  resultCard('EXÉCUTION · '+ev.who.split(' ·')[0].toUpperCase(),ch.b,msg.length?msg:[''],[],
   "Lancer le trimestre",phaseLive,{key:KEY});
 });

function stepEvents(){
 S.bigTape=false;

   <details><summary>Le calcul</summary>
   <p style="margin-top:8px">Sur ${n} observations trimestrielles, l'écart-type d'estimation de votre Sharpe annualisé est d'environ <b class="num">±${dec(seSR,2)}</b>. ${psr>0.95?"Au-delà de 95 %, c'est le seuil habituellement retenu pour dire qu'un historique contient autre chose que du bruit. Vous y êtes — sur huit points, ce qui reste très peu.":"En dessous de 95 %, un allocataire sérieux ne peut pas distinguer votre compétence de la chance. C'est vrai de la quasi-totalité des historiques de deux ans, y compris les bons."}</p>
   <div class="f">PSR = Φ[ ŜR·√(n−1) / √(1 − γ₃·ŜR + (γ₄−1)/4·ŜR²) ]<br>n = ${n} · ŜR<sub>trim</sub> = ${dec(srQ,3)} · γ₃ = ${dec(m3,2)} · γ₄ = ${dec(m4,2)}</div></details></div>
  <div class="block"><div class="blockhead"><h2>Hauts faits de la partie</h2><span class="hint">${FEATS.filter(f=>S.fl[f.id]).length} débloqués</span></div>
   <div class="feats">${FEATS.filter(f=>S.fl[f.id]).map(f=>`<div class="feat on"><span class="fic">${f.ic}</span><b>${f.nm}</b><span class="fd">${f.d}</span></div>`).join('')||'<p class="note">Aucun cette fois.</p>'}</div></div>
  <button class="cta gold" id="share">Partager ce résultat</button>
  <button class="cta ghost" id="hall2">Palmarès et hauts faits</button>
  <button class="cta" id="again">Rejouer avec d'autres choix</button>
  <button class="cta ghost" id="same">Rejouer la même configuration (graine ${S.seed})</button></div>`;
 recordRun({verdict,cagr,rank});
 document.getElementById('hall2').onclick=()=>screenHall(screenFinal);
 document.getElementById('share').onclick=async()=>{
  const txt=`${S.fundName} — ${verdict}. ${score(S.mgrFees-S.mgrCosts)} de gains de gérant, ${sgnp(cagr,1)} net annualisés sur ${n} trimestre${n>1?'s':''}, ${rank}${rank===1?'er':'e'} sur 4, perte max −${dec((S.maxdd*100),1)} %, Sharpe ${dec(sr,2)}. Profil ${PROF().nm.toLowerCase()}, ${VOL().nm.toLowerCase()}. Graine ${S.seed} — faites mieux : ${location.href.split('#')[0]}`;
  const b=document.getElementById('share');
  try{if(navigator.share){await navigator.share({title:'Le Book',text:txt});return}}catch(e){}
  try{await navigator.clipboard.writeText(txt);b.textContent='Résultat copié — collez-le où vous voulez'}catch(e){prompt('Copiez ce texte :',txt)}
 };
 document.getElementById('again').onclick=()=>{setup={prof:'fonda',arch:'std',desk:'inhouse',vol:'std',size:'mid',univ:'com',dur:'normal'};screenSetup();window.scrollTo(0,0)};
 document.getElementById('same').onclick=()=>{newGame(S.seed,S.prof,S.arch,S.desk,'std',S.size,'ext',S.dur);phaseOpen()};
}
if(!(hasSave()&&location.hash==='#resume'))screenIntro();else if(!loadGame())screenIntro();
</script>
</body></html>
