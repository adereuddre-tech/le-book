<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Book — prenez les commandes d'un fonds global macro de 100 milliards</title>
<meta name="description" content="Un jeu de gestion : quinze marchés, huit trimestres, quatre concurrents, des investisseurs nerveux et un comité des risques qui vous surveille. Prouvez que ce n'était pas de la chance.">
<meta property="og:title" content="Le Book — un fonds global macro de 100 milliards">
<meta property="og:description" content="Quinze marchés, trois tailles de fonds, huit trimestres, quatre concurrents, des rumeurs à acheter et des dépêches qui vous interrompent. Prouvez que ce n'était pas de la chance.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E1725'/%3E%3Crect x='10' y='34' width='8' height='20' fill='%234FA98C'/%3E%3Crect x='22' y='22' width='8' height='32' fill='%23C4576F'/%3E%3Crect x='34' y='14' width='8' height='40' fill='%234FA98C'/%3E%3Crect x='46' y='28' width='8' height='26' fill='%23D9B06A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1725; --panel:#15202F; --panel2:#1A2739; --panel3:#20304628;
  --line:#28374F; --line2:#35496A;
  --txt:#EAE7E0; --dim:#8C9BB2; --dimmer:#61738E;
  --long:#4FA98C; --short:#C4576F; --warn:#DFA45B; --flat:#33445F;
  --eq:#6E9BD1; --rt:#A98BD1; --fx:#4FA9A0; --cm:#C68A4E; --ex:#C46FA8;
  --gold:#D9B06A;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5}
#app{max-width:680px;margin:0 auto;padding:0 14px 100px}
@supports(padding:max(0px)){#app{padding-bottom:max(100px,calc(88px + env(safe-area-inset-bottom)))}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:500;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
em{font-style:italic;color:var(--txt)}

/* splash */
.splash{padding:28px 0 10px}
.spineart.big{height:120px;gap:4px;margin:0 0 26px}
.splash-h1{font-family:var(--serif);font-size:clamp(38px,12vw,64px);line-height:.95;margin:12px 0 0}
.splash-h1 em{color:var(--gold);font-style:italic}
.splash-p{color:var(--dim);font-size:15.5px;max-width:56ch;margin:16px 0 0}
.namebox{border:1px solid var(--gold);border-radius:10px;padding:16px 15px;margin-top:24px;background:linear-gradient(180deg,rgba(217,176,106,.10),rgba(217,176,106,0))}
.namein{width:100%;font-family:var(--serif);font-size:clamp(26px,7.5vw,38px);line-height:1.15;margin:10px 0 4px;background:transparent;border:none;border-bottom:1px solid var(--gold);color:var(--txt);padding:4px 0;outline:none}
.namein::placeholder{color:var(--dimmer)}
.namerow{display:flex;gap:8px;margin-top:8px}
.namerow select{flex:1;font-family:inherit;font-size:14px;background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:6px;padding:9px 8px;min-width:0}
/* ouverture */
.hero{padding:46px 0 8px}
.kicker{font-family:var(--mono);font-size:11.5px;color:var(--dimmer);letter-spacing:.05em}
.hero h1{font-family:var(--serif);font-size:clamp(44px,14vw,74px);line-height:.92;margin:12px 0 0}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--dim);margin:8px 0 0}
.prose{color:var(--dim);max-width:58ch}
.prose p{margin:14px 0 0}
.prose strong{color:var(--txt);font-weight:500}
.spineart{display:flex;gap:3px;align-items:center;height:52px;margin:26px 0 0}
.spineart i{flex:1;display:block;border-radius:1px}
.rules{border-top:1px solid var(--line);margin-top:22px}
.rule{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.rule b{font-family:var(--mono);font-size:11.5px;color:var(--dimmer);font-weight:500;min-width:88px;flex-shrink:0}
.rule span{color:var(--dim);font-size:14px}
.rule span strong{color:var(--txt);font-weight:500}

/* cartes de choix */
.pickgrp{margin-top:26px}
.pickhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line2);padding-bottom:6px}
.pickhead h2{font-size:16px;font-weight:600}
.pickhead span{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.card{border:none;border-radius:7px;padding:13px 14px 10px;background:transparent;display:block;width:100%;text-align:left}
.cardwrap{border:1px solid var(--line);border-left:3px solid var(--flat);border-radius:7px;margin-top:9px;background:var(--panel);transition:border-color .15s,background .15s}
.cardwrap.sel{border-color:var(--line2);border-left-color:var(--gold);background:var(--panel2)}
.carddet{padding:0 14px 11px}
.carddet summary{font-size:12px;color:var(--dimmer)}
.cardtop{display:flex;gap:11px;align-items:flex-start}
.ico{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(217,176,106,.10)}
.cardwrap.sel .ico{background:rgba(217,176,106,.24)}
.cardttl{min-width:0}
.reco{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:#0B1A14;background:var(--long);padding:2px 7px;border-radius:4px}
.cardwrap.sel .reco{background:#5FBE9E}
.brow .bh b{display:flex;align-items:center;gap:7px}
.bico{font-size:15px}
.commico{font-size:16px;margin-right:6px}
.card .who{font-family:var(--mono);font-size:11px;color:var(--gold);margin-bottom:4px}
.card b{display:block;font-weight:600;font-size:15px;margin-bottom:5px}
.card p{margin:0;color:var(--dim);font-size:13.5px}
.card ul{margin:8px 0 0;padding-left:0;list-style:none}
.card li{font-size:12.5px;color:var(--dim);padding:2px 0 2px 15px;position:relative;font-family:var(--mono)}
.card li::before{content:'▸';position:absolute;left:0;color:var(--dimmer)}
.card li.g{color:var(--long)}.card li.b{color:var(--short)}

.cta{display:block;width:100%;margin:22px 0 0;padding:15px;border-radius:7px;background:var(--txt);color:var(--ink);font-weight:600;font-size:16px;text-align:center}
.cta[disabled]{opacity:.32}
.cta.ghost{background:none;color:var(--txt);border:1px solid var(--line2);font-weight:500;margin-top:9px}
.cta.gold{background:var(--gold);color:#1A1206}
.seedrow{display:flex;gap:8px;align-items:center;margin:20px 0 0;color:var(--dim);font-size:13px}
.seedrow input{font-family:var(--mono);background:var(--panel);border:1px solid var(--line2);color:var(--txt);padding:7px 10px;border-radius:5px;width:106px;font-size:14px}

/* rumeurs & signaux */
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips i,.tcv i{font-style:normal;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;background:var(--panel2);color:var(--dimmer)}
.chips i.up,.tcv i.up{color:var(--long);background:rgba(79,169,140,.14)}
.chips i.dn,.tcv i.dn{color:var(--short);background:rgba(196,87,111,.14)}
.chips i.rel{margin-left:auto;color:var(--dim)}
.chips i.rel.forte{color:var(--gold);background:rgba(217,176,106,.12)}
.chips i.rel.faible{color:var(--dimmer)}
.news.rum .src{color:var(--gold)}
.news.rum>span{color:var(--txt)}
.tcv{margin-top:5px}
.tcvb{display:flex;gap:4px;align-items:center;width:100%;padding:0}
.tcvb .more{margin-left:auto;font-size:11px;color:var(--dimmer)}
/* palmarès */
.hrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-top:8px}
.hrow.top{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,176,106,.10),rgba(217,176,106,.02))}
.hrk{font-family:var(--mono);font-size:15px;color:var(--dimmer);min-width:18px;text-align:center;flex-shrink:0}
.hrow.top .hrk{color:var(--gold)}
.hmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hmid>b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{font-size:10.5px;color:var(--dimmer);line-height:1.25}
.hval{text-align:right;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.hval>b{font-family:var(--mono);font-size:15px}
.bico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;margin-right:10px;font-size:20px;line-height:1;vertical-align:middle;border-radius:50%;border:1.5px solid rgba(201,168,106,.55);background:radial-gradient(circle at 34% 28%,rgba(201,168,106,.22),rgba(201,168,106,.05) 70%);box-shadow:0 0 0 3px rgba(201,168,106,.07),inset 0 1px 2px rgba(255,255,255,.08)}
.gzr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px;padding:1px 0}
.gzr span{color:var(--dim)}
.gzr b{font-family:var(--mono)}
.hintx{background:none;border:0;color:var(--dimmer);font-size:17px;line-height:1;padding:0 2px;cursor:pointer}
.hintx:hover{color:var(--txt)}
.commrow{padding:5px 0;font-size:12.5px;border-top:1px solid var(--line)}
.commrow:first-of-type{border-top:0}
.commrow span{display:block;color:var(--dim);font-size:11.5px;letter-spacing:.02em}
.commrow b{display:block;margin-top:2px;font-family:var(--mono);font-size:13px}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-top:12px}
.feat{border:1px solid var(--line);border-radius:9px;padding:10px 9px;background:var(--panel);text-align:center;opacity:.42}
.feat.on{opacity:1;border-color:var(--gold);background:linear-gradient(180deg,rgba(217,176,106,.13),rgba(217,176,106,.02))}
.feat .fic{display:block;font-size:24px;line-height:1.2;filter:grayscale(1)}
.feat.on .fic{filter:none}
.feat b{display:block;font-size:11.5px;font-weight:600;margin:3px 0 2px;line-height:1.2}
.feat .fd{display:block;font-size:10px;color:var(--dimmer);line-height:1.25}
/* portraits & bandeau */
.ava{width:54px;height:54px;flex-shrink:0;display:block}
.evhead{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.evhead .who{margin:0;line-height:1.25}
.tick{display:flex;align-items:stretch;background:#8E2436;border-radius:5px;overflow:hidden;margin:6px -14px 0;height:26px}
.tlab{background:#fff;color:#8E2436;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:0 8px;display:flex;align-items:center;flex-shrink:0}
.twrap{flex:1;overflow:hidden;position:relative}
.tmove{position:absolute;white-space:nowrap;font-family:var(--mono);font-size:11px;color:#fff;line-height:26px;animation:tk 60s linear infinite;will-change:transform}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tmove{animation:none;left:8px}}
/* phases */
.phase{padding:40px 6px 20px;min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.ptitle{font-family:var(--serif);font-size:clamp(34px,10vw,50px);line-height:1;margin:12px 0 18px}
.plines{list-style:none;padding:0;margin:0}
.plines li{color:var(--dim);font-size:14.5px;padding:8px 0 8px 18px;border-top:1px solid var(--line);position:relative}
.plines li::before{content:'';position:absolute;left:0;top:15px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.plines li:last-child{border-bottom:1px solid var(--line)}
.plines b{color:var(--txt);font-weight:500}
.recap{font-family:var(--mono);font-size:11.5px}
/* barre d'état v3 */
.srow{display:flex;gap:6px;margin-top:5px}
.srow:first-child{margin-top:0}
.tile{flex:1;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile>span{font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;align-items:baseline;gap:5px;white-space:nowrap;overflow:hidden}
.tile>span i{font-style:normal;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile>span b{font-family:var(--mono);color:var(--txt);font-weight:500;flex-shrink:0}
.tile>span b span{margin-left:3px}
.tile>b{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tile .track{display:block;margin-top:3px}
.tile:active{background:var(--panel2)}
.tile.gold{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,176,106,.13),rgba(217,176,106,.03))}
.tile.gold>b{color:var(--gold);font-size:15px}
.tile.gold>span{color:var(--gold);opacity:.8}
.fg{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 4px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.fg .fl{font-family:var(--mono);font-size:9.5px;color:var(--dimmer);letter-spacing:.03em;white-space:nowrap}
.tri{font-size:8px;line-height:8px;letter-spacing:1px;height:8px;display:block}
.tri.up{color:var(--long)}.tri.dn{color:var(--short)}.tri.none{color:var(--flat)}
.fg .ft2{position:relative;display:block;width:100%;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.fg .ft2 i{position:absolute;top:0;bottom:0;border-radius:3px}
.fg .ft2 em{position:absolute;top:-1px;bottom:-1px;width:1px;background:var(--line2)}
.fg .ft2.lin em{width:2px;margin-left:-1px;background:var(--gold,#c9a86a);box-shadow:0 0 3px rgba(201,168,106,.8);z-index:3}
.fg .ft2.lin .band{border-left:1px solid rgba(201,168,106,.35);border-right:1px solid rgba(201,168,106,.35)}
.fg .ft2.lin .band{position:absolute;top:0;bottom:0;background:rgba(79,169,140,.22)}
.fg b{font-family:var(--mono);font-size:11px;font-weight:500;white-space:nowrap}
.fg.hot{border-color:var(--gold)}
.rowinfo{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);margin-top:5px;white-space:nowrap;overflow:hidden}
.rowinfo>span:last-child{overflow:hidden;text-overflow:ellipsis}
.rowinfo .fx{letter-spacing:.02em}
.rowinfo .fx b{font-weight:500}
#toast{position:fixed;left:14px;bottom:14px;z-index:60;background:#1F2C40;border:1px solid var(--gold);color:var(--txt);font-family:var(--mono);font-size:11.5px;line-height:1.45;padding:8px 12px;border-radius:7px;max-width:calc(100vw - 28px);width:max-content;opacity:0;transition:opacity .2s;pointer-events:none}
.news.locked>span{color:var(--dim)}
.buy{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:4px;border:1px solid var(--gold);color:var(--gold);margin-left:auto}
.buy:active{background:rgba(217,176,106,.15)}
.rescard{border:1px solid var(--line2);border-radius:9px;background:var(--panel);padding:14px 15px;margin-top:12px}
.rescard h3{font-family:var(--serif);font-size:23px;margin-bottom:8px}
.rescard p{color:var(--dim);font-size:14px;margin:0 0 8px}
.rescard p em{color:var(--txt);font-style:normal}
#toast.on{opacity:1;pointer-events:auto}
#toast .tclose{margin-left:10px;color:var(--dimmer)}
#modal{display:none;position:fixed;inset:0;z-index:80}
#modal .mback{position:absolute;inset:0;background:rgba(6,10,18,.72)}
#modal .mbox{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:680px;height:94vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-bottom:none;border-radius:12px 12px 0 0;padding:14px 16px 40px;font-size:14.5px}
#modal .mhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
#modal .mhead h3{font-family:var(--serif);font-size:24px}
#modal .mclose{font-size:22px;color:var(--dim);padding:0 4px}
#modal .mbody p{color:var(--dim);font-size:13.5px;margin:0 0 10px}
#modal .mbody p em{color:var(--txt);font-style:normal}
/* barre d'état */
.status{position:sticky;top:0;z-index:30;background:rgba(14,23,37,.95);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);margin:0 -14px;padding:8px 14px 7px}
.status .l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.status .q{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.status .nav{font-family:var(--mono);font-size:19px;font-weight:500}
.gauges{display:flex;gap:9px;margin-top:6px}
.gauge{flex:1}
.gauge .gl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:3px}
.gauge .gl b{font-family:var(--mono);font-weight:500;color:var(--txt)}
.track{height:3px;background:var(--flat);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;border-radius:2px;transition:width .4s}

/* blocs */
.block{margin:22px 0 0}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:11px}
.blockhead h2{font-size:15px;font-weight:600}
.blockhead .hint{font-size:11.5px;color:var(--dimmer);font-family:var(--mono)}
.wire{border:1px solid var(--line);border-radius:8px;padding:12px 13px;background:var(--panel)}
.wire+.wire{margin-top:8px}
.note{color:var(--dim);font-size:12.5px;margin:9px 0 0}
.note em{color:var(--txt);font-style:normal}
summary{cursor:pointer;font-size:13.5px;color:var(--dim)}
summary::marker{color:var(--dimmer)}

.news{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.news:last-child{border-bottom:none;padding-bottom:0}
.news .src{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);min-width:64px;flex-shrink:0}
.news.rum .src{color:var(--gold)}
.news.rum span{color:var(--gold)}

/* budget */
.brow{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:11px 12px;margin-top:9px}
.brow .bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.brow .bh b{font-size:14.5px;font-weight:600}
.brow .bh span{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.brow>p{margin:0 0 8px;font-size:12.5px;color:var(--dim)}
.lvls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.lvl{padding:8px 6px;border-radius:5px;background:var(--panel2);border:1px solid transparent;text-align:center}
.lvl.on{background:var(--panel);border-color:var(--gold)}
.lvl b{display:block;font-size:12.5px;font-weight:500}
.lvl span{font-family:var(--mono);font-size:10.5px;color:var(--dimmer)}
.efl{list-style:none;padding:0;margin:6px 0 0}
.efl li{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:3px 0}
.efl li b{color:var(--txt);font-weight:500}
.budtot{display:flex;justify-content:space-between;font-size:13.5px;padding:10px 0 0;color:var(--dim)}
.budtot b{font-family:var(--mono);color:var(--txt)}

/* book */
.sect{display:flex;align-items:center;gap:8px;margin:16px 0 5px}
.sect i{width:14px;height:2px;border-radius:1px}
.sect span{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em}
.pos{padding:9px 0 10px;border-bottom:1px solid var(--line)}
.pos .top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.pos .sym{font-family:var(--mono);font-weight:600;font-size:13.5px;min-width:46px}

const STAKE_POS=new Set();
function markStakePos(){
 STAKE.forEach(e=>{
  const src=(e.cond?e.cond.toString():'')+JSON.stringify(e.ch||[],(k,v)=>typeof v==='function'?v.toString():v);
  if(/IDX\.|zeroOn|halfOn|cutTop1|scaleAll|kContra|kToward|invert/.test(src))STAKE_POS.add(e.t);
 });
}
const POOLS={};let poolsSnap=false;
function snapPools(){
 if(poolsSnap)return;poolsSnap=true;
 [['MACROEV',MACROEV],['TRADER_EXEC',TRADER_EXEC],['TRADER_MID',TRADER_MID],['STAKE',STAKE],
  ['INCIDENTS',INCIDENTS],['BOARDEV',BOARDEV],['FEATS',FEATS]]
  .forEach(([nm,arr])=>{if(arr)POOLS[nm]={live:arr,all:arr.map(e=>e)}});
}
const ALLSYM=new Set(INSTR_ALL.map(x=>x.sym));
/* symboles cités ailleurs que dans hit : clés d'objet et chaînes exactes */
function symsOf(o,acc){
 acc=acc||[];
 if(Array.isArray(o)){o.forEach(v=>symsOf(v,acc));return acc}
 if(o&&typeof o==='object'){for(const k in o){if(k==='hit')continue;if(ALLSYM.has(k))acc.push(k);symsOf(o[k],acc)}return acc}
 if(typeof o==='string'&&ALLSYM.has(o))acc.push(o);
 return acc;
}
function setUniverse(sizeId,univId){
 snapPools();markStakePos();
 const per=MKPERCL[sizeId]||4, ncl=NCLASS[univId]||4;
 const cls=CLASSES.slice(0,ncl);
 const sel=INSTR_ALL.filter(x=>x.rk<=per&&cls.includes(x.grp));
 INSTR.length=0;sel.forEach(x=>INSTR.push(x));reindex();
 const ok=sy=>IDX[sy]!==undefined;
 /* hit : on élague les marchés fermés, on garde l'événement s'il en reste un */
 POOLS.MACROEV.live.length=0;
 POOLS.MACROEV.all.forEach(e=>{
  const h={};for(const sy in e.hit)if(ok(sy))h[sy]=e.hit[sy];
  if(!Object.keys(h).length)return;
  POOLS.MACROEV.live.push(h===e.hit?e:Object.assign({},e,{hit:h}));
 });
 /* need / effets : un seul symbole fermé suffit à écarter l'entrée */
 ['TRADER_EXEC','TRADER_MID','STAKE','INCIDENTS','BOARDEV','FEATS'].forEach(nm=>{
  const P=POOLS[nm];if(!P)return;

 });

  COV[i][j]=i===j?INSTR[i].sig**2:INSTR[i].sig*INSTR[j].sig*c}}}

/* ════════════════════ 4. ALÉA ════════════════════ */
let rng,spare=null,rngState=0;
function mulberry32(a){rngState=a|0;return function(){rngState=rngState+0x6D2B79F5|0;let t=Math.imul(rngState^rngState>>>15,1|rngState);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(){if(spare!==null){const t=spare;spare=null;return t}
 let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();
 const r=Math.sqrt(-2*Math.log(u));spare=r*Math.sin(2*Math.PI*v);return r*Math.cos(2*Math.PI*v)}
function pick(a){return a[Math.floor(rng()*a.length)]}
function drawK(d){let u=rng(),c=0;for(const k in d){c+=d[k];if(u<=c)return k}return Object.keys(d)[0]}
function uni(a,b){return a+rng()*(b-a)}

/* ════════════════════ 5. RISQUE & COÛTS ════════════════════ */
function weights(k){return k.map((v,i)=>v*U/INSTR[i].sig)}
function notionalBn(ki,i){return ki*U/INSTR[i].sig*S.nav}
function pvol(w){let v=0;for(let i=0;i<N;i++)for(let j=0;j<N;j++)v+=w[i]*w[j]*COV[i][j];return Math.sqrt(Math.max(v,0))}
function riskContrib(w){const sp=pvol(w);if(sp<1e-9)return w.map(()=>0);
 return w.map((wi,i)=>{let s=0;for(let j=0;j<N;j++)s+=COV[i][j]*w[j];return wi*s/sp})}
function varDecomp(w){const fv=[];let tot=0;
 for(let k=0;k<K;k++){let e=0;for(let i=0;i<N;i++)e+=w[i]*INSTR[i].sig*INSTR[i].b[k];fv.push(e*e);tot+=e*e}
 let idio=0;for(let i=0;i<N;i++)idio+=(w[i]*INSTR[i].sig*INSTR[i].idio)**2;
 return {fv,idio,tot:Math.max(tot+idio,1e-12)}}
function grossBn(k){let g=0;for(let i=0;i<N;i++)g+=Math.abs(notionalBn(k[i],i));return g}
/* ══════════ marge utilisée et risque majoré ══════════ */
const MGC={thr:0.50,warn:0.40,cut:0.60,crisis:1.8,trough:0.55};

/* ══════════ capacité : l'encours finit par se payer en impact ══════════ */
const CAPSOFT={small:1.9,mid:1.5,mega:1.25};
function capSoftNav(){return S.aum0*(CAPSOFT[S.size]||1.5)}
function capStress(){return Math.max(0,S.nav/capSoftNav()-1)}
function capFactor(){return 1+1.30*capStress()}

/* contexte d'évaluation d'un objectif trimestriel */
function goalCtx(o){

 const cls=nm=>k.filter((v,i)=>v!==0&&INSTR[i].grp===nm).length;
 const openCls=[...new Set(INSTR.map(x=>x.grp))];
 const nClasses=openCls.filter(g=>cls(g)>0).length;
 const evP=(S.evLog||[]).map(e=>e.pnl||0);

 return {
  q:o.qTotal,prevQ:S.rets.length>1?S.rets[S.rets.length-2]:0,

  rank:o.rank,rankUp:(g0.rank||o.rank)-o.rank,
  vol:S.realVol,tgt:S.tgt,inBand:Math.abs(pvol(w)-S.tgt)/S.tgt<=ARCH().band,
  dd:o.dd,newHigh:S.nav>=S.hwm-1e-9,rate:S.rate,
  mgu:marginPct(k),marginCall:!!S.marginCall,lev:grossBn(k)/Math.max(1e-9,S.nav),
  maxK:k.reduce((a,v)=>Math.max(a,Math.abs(v)),0),
  nPos,nLong:k.filter(v=>v>0).length,nShort:k.filter(v=>v<0).length,
  fx:factorExpo(w),fmax:vd.tot>0?Math.max(...vd.fv)/vd.tot:0,

  ev:(S.evLog||[]).length,bestEv:evP.length?Math.max(...evP):0,worstEv:evP.length?Math.min(...evP):0,

  tcBp:Math.abs(S.qPnl?S.qPnl.tcM:0)/Math.max(1e-9,navB*1000)*1e4,

 };
}
function marginPct(k){let m=0;for(let i=0;i<N;i++)m+=Math.abs(notionalBn(k[i],i))*INSTR[i].mg;return m/Math.max(1e-9,S.nav)}
/* stress de corrélation : les couvertures cessent de couvrir.
   rho* = rho + kappa(1-|rho|)·signe(wi·wj) — augmente la variance quel que soit le sens des paires */
function volStress(w,kap){

 S.evQueue.filter(ev=>!ev.trader).slice(0,3).forEach(ev=>{if(rng()<pr){out.push({src:'Pré-annonce',t:ev.rum||`Le desk entend parler de : « ${ev.t} »`,v:eventFactorVec(ev),rel:'moyenne',ev:true,truth:true})}});
 if(rng()<pr*0.45){const f=pick(MACROEV.filter(e=>!S.evQueue.includes(e)&&!S.usedMacro.includes(e.t)));
   if(f)out.push({src:'Pré-annonce',t:f.rum||`Le desk entend parler de : « ${f.t} »`,v:eventFactorVec(f),rel:'faible',ev:true,truth:false})}
 /* rumeurs factorielles */
 let guard=0;
 while(out.length<n&&guard++<400){
   const r=pick(RUMORS);if(used.has(r.t))continue;
   const p=Math.max(0.35,Math.min(0.95,RELP[r.rel]+relB));
   const wantTrue=rng()<p;
   const d=dot(r.v);
   const agrees=Math.abs(d)<0.25?null:d>0;
   if(agrees!==null&&agrees!==wantTrue)continue;
   used.add(r.t);out.push({...r,truth:wantTrue,p});
 }
 for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
 const PM={faible:1.4,moyenne:3.5,forte:8.0},RM=[1.3,1.0,0.6][S.bud.res];
 out.forEach(r=>{
   r.bought=false;
   /* prix en M$ = pb de l'encours ; un encours dix fois plus gros paie dix fois plus */
   const pb=(r.ev?5.5:PM[r.rel])*RM;
   r.price=+(pb*0.1*S.nav).toFixed(S.nav<0.3?3:S.nav<3?2:1);
   let fk=-1,fv=0;r.v.forEach((z,k)=>{if(Math.abs(z)>fv){fv=Math.abs(z);fk=k}});r.fk=fk;
   r.teaser=(r.t&&r.t.length>44)?r.t.slice(0,44).replace(/\s+\S*$/,'')+'…':(r.t||'');
 });
 S.rumors=out.filter(r=>r&&r.t&&r.src&&Array.isArray(r.v)&&r.rel);S.rumors.forEach(r=>{if(!r.teaser)r.teaser=r.t});rumorEst();
 /* estimations trend / carry / value avec bruit selon la recherche */
 const e=RESTCV[S.bud.res];
 S.tcvEst={t:S.tcv.t.map(z=>quant(z+e*gauss())),c:S.tcv.c.map(z=>quant(z+e*gauss())),v:S.tcv.v.map(z=>quant(z+e*gauss()))};
}
/* rendements du trimestre */
function marketReturns(){return S.rBase}
function drawReturns(){
 const R=REG[S.truth];
 return INSTR.map((x,i)=>{
   let z=0;for(let k=0;k<K;k++)z+=x.b[k]*S.f[k];
   z+=x.idio*R.si*gauss();
   let r=x.sigQ*z;
   r+=x.sigQ*(0.12*S.tcv.t[i]+0.10*S.tcv.c[i]+0.08*S.tcv.v[i]);
   if(x.drift)r+=x.drift*(S.truth==='crise'?-2.2:S.truth==='recession'?-0.9:1);
   if(R.crowd)r-=R.crowd*S.crowd[i]*x.sigQ;
   return r;
 });
}
function rivalReturns(){
 return S.rivals.map(rv=>{
   let e=0;for(let k=0;k<K;k++){const s=rng()<rv.skill?Math.sign(S.f[k]||1):-Math.sign(S.f[k]||1);e+=s*S.f[k]}
   const r=(rv.vol/2)*(0.70*e/2+0.78*gauss())-0.008;
   return r;
 });
}
</script>

const SAVEKEY='lebook_save_v2';
function store(){try{return window.localStorage}catch(e){return null}}

function evTag(e){
 if(!e)return null;
 if(e.rivalEv)return {k:'rival',i:e.i,r:S.rivals.findIndex(x=>x.nm===e.rv.nm)};
 if(e.stake)return {k:'stake',t:e.t};
 if(e.trader)return {k:'trader',t:e.t};
 return {k:'macro',t:e.t};
}
function evFromTag(g){
 if(!g)return null;
 if(g.k==='rival')return {rivalEv:true,i:g.i,rv:S.rivals[g.r]};
 if(g.k==='stake'){const e=STAKE.find(x=>x.t===g.t);return e?{trader:true,stake:true,...e}:null}
 if(g.k==='trader'){const e=TRADER_MID.find(x=>x.t===g.t);return e?{trader:true,...e}:null}
 return MACROEV.find(x=>x.t===g.t)||null;
}
function save(point,extra){
 const st=store();if(!st||!S)return;
 try{
  S.resume=point;S.resumeO=extra||null;
  const d=JSON.parse(JSON.stringify(S,(k,v)=>k==='evQueue'||k==='preDesk'?undefined:v));
  d.evQ=S.evQueue.map(evTag);d.preD=evTag(S.preDesk);
  d.b=INSTR.map(x=>x.b);d.rngState=rngState;d.spare=spare;d.U=U;d.fundName=S.fundName;
  st.setItem(SAVEKEY,JSON.stringify(d));
 }catch(e){}
}

function loadGame(){
 const st=store();if(!st)return false;
 try{
  const d=JSON.parse(st.getItem(SAVEKEY));if(!d)return false;
  rng=mulberry32(0);rngState=d.rngState;spare=d.spare===undefined?null:d.spare;U=d.U;
  INSTR.forEach((x,i)=>{x.b=d.b[i];normB(x);x.sigQ=x.sig/2});buildCov();
  S=d;fundName=d.fundName;
  if(S.goal&&S.goal.nm)S.goal=QGOALS.find(g=>g.nm===S.goal.nm)||null;
  S.evQueue=(d.evQ||[]).map(evFromTag).filter(Boolean);S.preDesk=evFromTag(d.preD);
  const P={phaseOpen:()=>phaseOpen(),screenBudget:()=>screenBudget(),phaseDesk:()=>phaseDesk(),screenPlay:()=>screenPlay(),
   screenComm:()=>screenComm(),phaseExec:()=>phaseExec(),screenExec:()=>screenExec(),phaseLive:()=>phaseLive(),
   stepEvents:()=>stepEvents(),phaseClose:()=>phaseClose(S.resumeO),screenDebrief:()=>screenDebrief(S.resumeO),
   screenFinal:()=>screenFinal(),screenBoard:()=>screenBoard()};
  (P[S.resume]||P.phaseOpen)();window.scrollTo(0,0);return true;
 }catch(e){clearSave();return false}
}

 fb+=`<div class="fb"><span class="fn">Propre aux marchés</span><span class="ft"><i style="width:${Math.min(100,vd.idio/vd.tot*100)}%"></i></span><span class="fv">${(vd.idio/vd.tot*100).toFixed(0)} %</span></div>`;
 const top=rc.map((v,i)=>({v,i})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3).filter(o=>Math.abs(o.v)>1e-6);
 const RS=riskShown(w),MGU=marginPct(S.k);
 let flags='';
 if(capStress()>0)flags+=`<div class="flag"><span>L'encours a dépassé ${moneyB(capSoftNav())}, la taille au-delà de laquelle ce book ne se déploie plus sans se voir : impact de marché ×${capFactor().toFixed(2)} sur chaque ordre. La capacité de la stratégie est atteinte.</span></div>`;
 if(MGU>MGC.thr)flags+=`<div class="flag"><span>Marge utilisée ${(MGU*100).toFixed(0)} % de l'encours, au-dessus du seuil de ${(MGC.thr*100).toFixed(0)} % du prime broker. Un trimestre négatif déclenchera une liquidation d'office.</span></div>`;
 else if(MGU>MGC.warn)flags+=`<div class="flag"><span>Marge utilisée ${(MGU*100).toFixed(0)} % de l'encours. Le seuil d'appel est à ${(MGC.thr*100).toFixed(0)} %.</span></div>`;
 if(sp>S.tgt*(1+band))flags+=`<div class="flag"><span>Vol ex-ante ${pct(sp)} contre une cible de ${pct(S.tgt,0)} — hors de la bande de tolérance de votre comité (±${(band*100).toFixed(0)} %).</span></div>`;
 if(sp<S.tgt*0.5&&sp>0.001)flags+=`<div class="flag"><span>Vous facturez ${(S.budBp*4/100+2).toFixed(1)} % de frais annuels pour un book à ${pct(sp)} de volatilité.</span></div>`;
 if(sp<=0.001)flags+=`<div class="flag"><span>Aucune position. Le collatéral rapporte le taux au jour le jour, les frais courent, le comité regarde.</span></div>`;
 if(fmax>0.62)flags+=`<div class="flag"><span>${(fmax*100).toFixed(0)} % de votre variance vient du seul facteur « ${FACT[vd.fv.indexOf(Math.max(...vd.fv))].nm.toLowerCase()} ». Douze lignes, un pari.</span></div>`;
 document.getElementById('risk').innerHTML=`
  <div class="kv"><span>Risque du book · cible ±bande</span><b>${pct(RS.total)} · ${pct(S.tgt,0)} ±${(band*100).toFixed(0)} %</b></div>
  <div class="kv"><span>Notionnel brut / net</span><b>${moneyB(gr)} / ${net>=0?'+':'−'}${moneyB(Math.abs(net))}</b></div>
  <div class="kv"><span>Levier brut sur encours</span><b>${(gr/S.nav).toFixed(2)}×</b></div>
  <div class="kv"><span>Marge utilisée · seuil d'appel</span><b class="${MGU>MGC.thr?'neg-g':''}">${(MGU*100).toFixed(0)} % · ${(MGC.thr*100).toFixed(0)} %</b></div>
  <div class="kv"><span>Perte à −2 σ trimestriels</span><b class="neg-g">${sgn(-sp)} · ${moneyB(sp*S.nav)}</b></div>
  ${fb}
  ${top.length?`<div class="kv" style="margin-top:8px"><span>Principaux contributeurs au risque</span><b>${top.map(o=>INSTR[o.i].sym+' '+(o.v/sp*100).toFixed(0)+'%').join(' · ')}</b></div>`:''}
  ${flags}`;
 renderTC();
}
function renderTC(){
 let tot=0,rows='';
 for(let i=0;i<N;i++){
  const d=S.k[i]-S.k0[i];if(Math.abs(d)<1e-9)continue;
  const t=tcost(d,i);tot+=t.cost;
  rows+=`<div class="attr"><span class="an"><span class="num" style="color:var(--txt)">${INSTR[i].sym}</span> <span style="font-family:var(--mono);font-size:11px;color:var(--dimmer)">${S.k0[i]>0?'+':''}${S.k0[i]} → ${S.k[i]>0?'+':''}${S.k[i]} · ${moneyB(t.bn)}</span></span>
   <span class="av neg-g">${t.bp.toFixed(1)} pb · ${mm(t.cost)}</span></div>`;
 }
 const el=document.getElementById('tc');if(!el)return;
 el.innerHTML=rows||`<p class="note" style="margin:0">Aucun ordre à passer : le book est inchangé, vous ne payez rien.</p>`;
 if(rows)el.innerHTML+=`<div class="kv" style="margin-top:8px"><span>Coût total des ordres</span><b class="neg-g">${mm(tot)} · ${sgn(-tot/S.nav,2)} de l'encours</b></div>
  <p class="note">Multiplicateur d'exécution appliqué : ×${(EXECM[S.bud.exec]*DESK().mult(INSTR[0])*S.liq*(1+(S.rate-0.03)*4)*S.execPenalty*PROF().tcMult).toFixed(2)} sur les actions (budget desk, organisation, liquidité du régime ${S.liq.toFixed(2)}, taux ${(S.rate*100).toFixed(1)} %${S.execPenalty>1?', pénalité débauchage':''}).${S.star>=0?` <em>Votre recrutement du trimestre travaille sur ${INSTR[S.star].sym} : coûts divisés par trois sur ce marché.</em>`:''}</p>`;
}
function commitOrders(){
 let tot=0;
 for(let i=0;i<N;i++){const d=S.k[i]-S.k0[i];if(Math.abs(d)>1e-9)tot+=tcost(d,i).cost}
 S.pendingTC=tot/S.nav;S.totalTC+=tot;S.phase='events';S.hotFactor=null;S.qLog=[];
 const pv=previewGauge();gauge(pv.lp,pv.rc,`Book validé pour le trimestre — ${pv.why||'sans remarque'}`);
 return tot;
}

<script>
/* ════════════════════ 8. DÉROULÉ DU TRIMESTRE ════════════════════ */

const GAMEHINTS={
 comm:["Ce que vous annoncez","<p>Vous promettez un rendement <em>et</em> une fourchette de volatilité réalisée. Les deux doivent être tenus : livrer la performance avec le double du risque annoncé compte comme un échec.</p><p>Ne rien promettre coûte peu, mais coûte à coup sûr. Promettre fort rapporte gros et coûte davantage encore si ça casse : c'est le seul endroit du jeu où vous choisissez votre propre asymétrie.</p>"],

 hint('comm');save('screenComm');S.commPick=S.commPick||null;
 const w=weights(S.k),sp=pvol(w),g=VOL().goal/4;

  {id:'fort',ico:'📣',nm:"Conviction forte",who:"« C'est le trimestre de l'année »",p:`Vous annoncez une fois et demie l'objectif de votre mandat, soit ${pct(1.5*g,1)}. Si vous y arrivez, on vous croira sur parole pendant deux ans. Sinon, on s'en souviendra aussi longtemps.`,

 ];
 app.innerHTML=statusBar()+`<div class="fade">

  <p class="note">L'annonce ne change rien tout de suite : elle se solde à la fin du trimestre, sur le résultat tout compris, commissions et coûts déduits.</p>

function screenExec(){
 hint('exec');
 save('screenExec');
 const orders=[];let tot=0;
 for(let i=0;i<N;i++){const d=S.k[i]-S.k0[i];if(Math.abs(d)>1e-9){const t=tcost(d,i);tot+=t.cost;orders.push({i,d,t})}}
 const av=TRADER_EXEC.filter(e=>!S.usedExec.includes(e.t)&&!(e.who.startsWith('Sœur')&&S.prof!=='syst')&&!(e.who.startsWith('Dwight')&&S.desk!=='algo')
   &&(!e.need||e.need.some(sy=>orders.find(o=>INSTR[o.i].sym===sy)))&&(!e.need3||S.k.some(v=>Math.abs(v)===3)));
 const ev=av.length?pick(av):null;if(ev)S.usedExec.push(ev.t);
 const mult=EXECM[S.bud.exec]*S.liq*(1+(S.rate-0.03)*4)*S.execPenalty*PROF().tcMult;
 app.innerHTML=statusBar()+`<div class="fade">
  <div class="block"><details open><summary style="font-size:15px;color:var(--txt);font-weight:600">Récapitulatif des ordres · ${orders.length} marché${orders.length>1?'s':''}</summary>
   <div class="wire">${orders.length?orders.map(o=>`<div class="attr"><span class="an"><span class="num" style="color:${GRPC[INSTR[o.i].grp]}">${INSTR[o.i].sym}</span> <span class="recap" style="color:var(--dimmer)">${S.k0[o.i]>0?'+':''}${S.k0[o.i]} → ${S.k[o.i]>0?'+':''}${S.k[o.i]} · ${moneyB(o.t.bn)}</span></span><span class="av neg-g">${o.t.bp.toFixed(1)} pb · ${mm(o.t.cost)}</span></div>`).join('')
    +`<div class="kv" style="margin-top:8px"><span>Total au tarif standard</span><b class="neg-g">${mm(tot)} · ${sgn(-tot/S.nav,3)}</b></div>`
    :`<p class="note" style="margin:0">Aucun ordre. Le book est reconduit.</p>`}
   <p class="note">Multiplicateur du trimestre ×${mult.toFixed(2)} : budget desk ×${EXECM[S.bud.exec].toFixed(2)}, liquidité ×${S.liq.toFixed(2)}, taux ×${(1+(S.rate-0.03)*4).toFixed(2)}, profil ×${PROF().tcMult.toFixed(2)}${S.execPenalty!==1?`, débauchage ×${S.execPenalty.toFixed(2)}`:''}. Organisation « ${DESK().nm.toLowerCase()} » appliquée marché par marché.${S.star>=0?` Recrue du trimestre sur ${INSTR[S.star].sym} : ÷3.`:''}</p>
  </div>
  ${ev?`<div class="evwrap" style="padding-top:14px"><div class="evcard">${evHead(ev.who,'trader')}<h3>${ev.t}</h3><p>${ev.p}</p></div>
   ${ev.ch.map((c,i)=>`<button class="choice" data-i="${i}"><b>${c.b}</b><span>${c.s}</span></button>`).join('')}</div>`
   :`<button class="cta" id="go2">Lancer le trimestre</button>`}
 </div>`;
 const done=()=>{S.totalTC+=(S.pendingTC*S.nav)-tot;phaseLive()};
 if(ev&&ev.ch)ev.ch.forEach(c=>{delete c.e._hit});
 if(!ev){document.getElementById('go2').onclick=done;return}
 setTimeout(()=>armTimer(()=>{const bs=app.querySelectorAll('.choice');if(bs.length)bs[bs.length-1].click()}),0);
 app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
  const ch=ev.ch[+b.dataset.i],e=ch.e;let msg=[];const navB0=S.nav;
  if(e.tcMult){let sub=0;
   if(e.tcMultOn){orders.forEach(o=>{if(e.tcMultOn.includes(INSTR[o.i].sym))sub+=o.t.cost})}else sub=tot;
   let m=e.tcMult;
   if(e.gamble&&rng()<e.gamble[0]){m=e.gamble[1];msg.push("Le gros acheteur s'est aperçu de la manœuvre et a tout retiré.")}
   const delta=sub*(m-1);S.pendingTC+=delta/S.nav;
   msg.push(`Coûts d'exécution ${delta<=0?'':'+'}${mm(delta)}.`)}
  if(e.risk){if(rng()<e.risk[0]){S.nav*=(1+e.risk[1]);S.qEvM+=e.risk[1]*navB0;msg.push(`${e.riskMsg||'Le marché est parti pendant l\'exécution'} : ${sgn(e.risk[1],2)}.`);e._hit=true}
   else if(e.safePnl){S.nav*=(1+e.safePnl);S.qEvM+=e.safePnl*navB0;e._hit=true;msg.push(e.safeTxt)}}
  if(e.invert){const i=IDX[e.invert];S.k[i]=-S.k[i];msg.push(`Position sur ${e.invert} inversée pour le trimestre.`)}
  if(e.cap2){for(let i=0;i<N;i++)if(Math.abs(S.k[i])===3){const d=S.k[i]>0?-1:1;const t=tcost(d,i);S.k[i]+=d;S.pendingTC-=t.cost*0.8/S.nav;msg.push(`${INSTR[i].sym} ramené à ${S.k[i]>0?'+':''}${S.k[i]}.`)}}
  if(e.leakQ)S.leakQ=true;
  if(e.poach)S.poachBoost+=e.poach;
  if(e.cash){S.nav*=(1+e.cash);S.qEvM+=e.cash*navB0;msg.push(`Trésorerie ${sgn(e.cash,2)}.`)}
  if(e.cashM){S.nav+=e.cashM/1000;S.qEvM+=e.cashM/1000;msg.push(`${e.cashM>=0?'+':'−'}${Math.abs(e.cashM)} M$.`)}
  if(e.halfOn){const arr=Array.isArray(e.halfOn)?e.halfOn:[e.halfOn];arr.forEach(sy=>{const i=IDX[sy];const nk=Math.trunc(S.k[i]/2);if(nk!==S.k[i]){const t=tcost(nk-S.k[i],i);S.pendingTC-=t.cost*0.7/S.nav;S.k[i]=nk;msg.push(`${sy} ramené à ${nk>0?'+':''}${nk}.`)}})}
  if(e.cutTop1){const w=weights(S.k),rc=riskContrib(w);const o=rc.map((v,i)=>({v:Math.abs(v),i})).sort((a,b)=>b.v-a.v)[0];if(o&&S.k[o.i]!==0){const d=-Math.sign(S.k[o.i]);const t=tcost(d,o.i);S.k[o.i]+=d;S.pendingTC-=t.cost*0.8/S.nav;msg.push(`${INSTR[o.i].sym} ramené à ${S.k[o.i]>0?'+':''}${S.k[o.i]}.`)}}
  if(e.scaleAll){for(let i=0;i<N;i++){const nk=Math.round(S.k[i]*e.scaleAll);if(nk!==S.k[i]){S.k[i]=nk;msg.push(`${INSTR[i].sym} → ${nk>0?'+':''}${nk}.`)}}}

  S.totalTC+=(S.pendingTC*S.nav)-tot;
  resultCard('EXÉCUTION · '+ev.who.split(' ·')[0].toUpperCase(),ch.b,[ch.s,...msg],
   [['Coûts d\'exécution du trimestre',`<span class="neg-g">−${mm(S.pendingTC*S.nav)}</span>`],['Marché pendant l\'exécution',`<span class="${cls(pnl)}">${sgn(pnl,2)} · ${mn(pnl*navB0)}</span>`],['Jauges',`<span class="${cls(g.lp+g2.lp)}">${sd1(g.lp+g2.lp)}</span> · <span class="${cls(g.rc+g2.rc)}">${sd1(g.rc+g2.rc)}</span>`]],

function stepEvents(){
 save('stepEvents');

 if(S.evIdx<S.evQueue.length){const e=S.evQueue[S.evIdx++];
   if(e.stake&&e.cond&&!e.cond()){stepEvents();return}
   if(e.rivalEv){if(Math.sign(S.k[e.i])===Math.sign(S.rBase[e.i])){stepEvents();return}screenRivalEvent(e);window.scrollTo(0,0);return}

 if(S.incidentDue&&!S.incidentShown){S.incidentShown=true;screenIncident();window.scrollTo(0,0);return}

function screenMacroEvent(ev){
 hint('event');
 const w=weights(S.k);
 let imm=0;const touched=[];
 for(const sym in ev.hit){const i=IDX[sym];const r=0.5*ev.hit[sym]*INSTR[i].sigQ;imm+=w[i]*r;touched.push(i)}
 const navB=S.nav;S.nav*=(1+imm);S.qEvM+=imm*navB;
 if(ev.liq)S.liq*=ev.liq;
 const prof=PROF();

 const mh=Math.max(...Object.values(ev.hit).map(Math.abs));
 if(mh>0.8)gauge(-(0.4+0.5*mh),-(0.2+0.2*mh),"Nervosité : investisseurs et comité lisent les mêmes dépêches que vous");
 /* scénarios de la suite du mouvement, tirés maintenant, révélés après */
 if(!S.sc){
  const raw=[0.10+Math.pow(rng(),1.6)*1.6,0.10+Math.pow(rng(),1.6)*1.2,0.08+Math.pow(rng(),1.8)*1.4];

  const mv=INSTR.map((x,i)=>({x,r:S.lastR[i]})).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r)).slice(0,6);
  mv.forEach(o=>T.push(`${o.x.sym} ${o.r>=0?'▲':'▼'}${Math.abs(o.r*100).toFixed(1)}%`));
  const last=S.rets[S.rets.length-1];T.push(`${S.fundName.toUpperCase()} ${last>=0?'▲':'▼'}${Math.abs(last*100).toFixed(1)}% AU DERNIER TRIMESTRE`);
  const best=[...S.rivals].sort((a,b)=>b.last-a.last)[0];T.push(`${best.nm.toUpperCase()} ${best.last>=0?'▲':'▼'}${Math.abs(best.last*100).toFixed(1)}%`);
 } else T.push('OUVERTURE DE MANDAT','LE MARCHÉ VOUS ATTEND');
 T.push(`TAUX AU JOUR LE JOUR ${(S.rate*100).toFixed(2)}%`);
 T.push(`ENCOURS ${moneyB(S.nav)}`);
 (S.rumors||[]).filter(r=>r.bought).slice(0,3).forEach(r=>T.push(`${r.src.toUpperCase()} : ${r.t.toUpperCase()}`));

}

function qRegime(){
 const f=S.f||[0,0,0,0];
 const m=QNAMES.filter(x=>{try{return !x.gen&&x.t(f)}catch(e){return false}});
 const pool=m.length?m:QNAMES.filter(x=>x.gen);
 return pool[Math.floor(rng()*pool.length)];
}
function verdicts(o){

  :lp>58?t(["Le ton reste cordial, avec la réserve de gens qui vous prêtent beaucoup.","On vous écoute, on ne vous interrompt pas, on prend des notes.","La relation est saine : ni enthousiasme, ni méfiance.","On vous fait confiance, à la condition tacite que ça continue.","Les rendez-vous se tiennent, courts et sans tension."],1)
  :lp>38?t(["Les questions deviennent précises et les réponses sont relues.","On vous demande des chiffres que personne ne demandait il y a six mois.","Un comité d'investissement a inscrit votre fonds à son ordre du jour.","Le ton s'est refroidi sans qu'on vous dise pourquoi.","On vous compare, à voix haute, à des gérants que vous ne citiez pas."],1)
  :lp>20?t(["Deux allocataires ont demandé les formulaires de rachat « pour information ».","On ne vous reproche rien de précis, ce qui est plus inquiétant qu'un reproche.","Le principal investisseur délègue désormais vos rendez-vous.","Les appels ne sont plus retournés le jour même.","Un consultant a été mandaté pour « revoir l'allocation »."],1)
  :t(["Les lettres recommandées ont commencé à arriver.","On ne parle plus de performance, on parle de délais de préavis.","Un conseil de surveillance a voté votre sortie ; il attend la fenêtre.","Le mot « liquidation » a été prononcé dans une réunion où vous n'étiez pas.","Vos investisseurs se parlent entre eux, et pas de vous en bien."],1));

  :q>goal*0.8?t([`${sgnp(q,1)} : exactement ce qu'ils ont acheté, ni plus ni moins.`,`Un trimestre conforme à ${sgnp(q,1)}. Personne ne s'extasie, personne ne s'inquiète.`,`${sgnp(q,1)} : le genre de chiffre qui ne déclenche aucun appel.`,`${sgnp(q,1)}, dans la trajectoire. La lettre s'écrira toute seule.`],2)
  :q>0?t([`${sgnp(q,1)} : positif, mais sous le mandat. Ils remarquent l'écart.`,`Un trimestre à ${sgnp(q,1)} dont le collatéral a fait une partie, et ils le savent.`,`${sgnp(q,1)} : ni félicitations ni reproches, juste un silence poli.`,`${sgnp(q,1)} : de quoi tenir, pas de quoi lever.`],2)
  :q>-0.03?t([`${sgnp(q,1)} : une perte modérée, qu'ils acceptent si elle est expliquée.`,`Un trimestre à ${sgnp(q,1)}. Ils ont vu pire — et surtout mieux.`,`${sgnp(q,1)} : la lettre trimestrielle va devoir être bien écrite.`,`${sgnp(q,1)} : le genre de chiffre qu'on oublie s'il ne se répète pas.`],2)
  :t([`${sgnp(q,1)} : le chiffre a circulé avant la lettre, sans commentaire.`,`Une perte de ${sgnp(q,1)} : ils parlent de « trimestre difficile », ce qui est leur façon de ne pas dire le mot qu'ils pensent.`,`${sgnp(q,1)} : on vous demande si le processus a été respecté. La question n'est jamais innocente.`,`${sgnp(q,1)} : deux investisseurs ont demandé la liste complète des positions.`],2));
 /* relatif ou contexte */
 I.push(rel>0.01?t([`Vous battez la médiane des concurrents de ${sgnp(rel,1)} : c'est ce qu'ils regardent en premier.`,`${rank===1?'Premier':rank+'e'} sur cinq : le tableau comparatif joue pour vous.`,`Devant ${best.nm}, ce trimestre. On ne vous en félicitera pas, mais on l'a noté.`],3)
  :rel>-0.01?t(["La comparaison avec les concurrents ne tranche pas ce trimestre.","Vous faites comme les autres, ce qui pose la question de pourquoi vous payer plus cher.","Dans le peloton : rien à écrire, rien à défendre."],3)
  :t([`${sgnp(rel,1)} contre la médiane des concurrents, et c'est ce chiffre qu'ils retiennent.`,`${rank}e sur cinq : ${best.nm} a fait mieux, avec moins de risque affiché.`,"Derrière la concurrence. Quelqu'un a demandé si votre processus était « toujours adapté ».",`On vous compare à ${best.boss}, et pas à votre avantage.`],3));
 if(dd>0.12)I.push(t([`${(dd*100).toFixed(0)} % sous le plus haut : ils calculent le temps du retour et n'aiment pas le résultat.`,`Un repli de ${(dd*100).toFixed(0)} %. Certains parlent de moyenner, la plupart de diversifier.`],4));
 else if(S.idx>=(S.hwmIdx||1)-1e-9)I.push(t(["Nouveau plus haut : les conversations sur le passé s'arrêtent.","Plus haut historique franchi. L'argent gagné a un autre goût que l'argent récupéré."],4));
 if(S.commRes)I.push(S.commRes.ok?t(["L'engagement du trimestre est tenu : ils aiment les gens dont la parole est chiffrée.","Promesse tenue, et notée dans un compte rendu de comité."],13)
   :t(["L'engagement n'est pas tenu. Personne ne relit la lettre à voix haute, ce qui est pire.","Promesse manquée. Ils se souviendront surtout que vous l'aviez prise.","La lettre du trimestre dernier circule, annotée."],13));
 /* comité : ton */
 C.push(rc>78?t(["Le dossier a été expédié en dix minutes, et c'est un compliment.","Mireille Cauchemar a signé le rapport sans une annotation.","Le comité vous cite en exemple, ce qui ne vous fera pas que des amis."],7)
  :rc>58?t(["Validé avec deux remarques de forme.","Rien de bloquant, quelques points à surveiller.","Le comité est satisfait, au sens administratif du terme."],7)
  :rc>38?t(["Un point intermédiaire est demandé le mois prochain.","Le rapport revient annoté en rouge à trois endroits.","On vous rappelle que les limites ne sont pas des objectifs.","Le comité demande à voir vos calculs, pas vos conclusions."],7)
  :rc>20?t(["Le comité a saisi le conseil d'un « point d'attention ».","Un plan de réduction du risque vous est réclamé par écrit.","On parle de vous à la troisième personne, en votre présence."],7)
  :t(["La réduction du mandat a été mise au vote. Il manquait une voix.","Le conseil demande si le gérant est « encore le bon ».","Le dossier est parti au conseil avec une recommandation qu'on ne vous a pas lue."],7));
 /* risque */
 C.push(dev<band*0.5?t([`Vol ex-ante ${pct(sp)} : au cœur de la bande, là où le comité aime vous voir.`,`Dimensionnement calibré (${pct(sp)}) : rien à redire.`],8)

  :sp>S.tgt?t([`${pct(sp)} de vol : hors bande par le haut. « Ce n'est pas un book, c'est une conviction avec des positions autour. »`,`Vol ex-ante ${pct(sp)} : le comité y voit un pari plus gros que le mandat.`],8)
  :t([`${pct(sp)} de vol pour un mandat à ${pct(S.tgt,0)} : on vous reproche de facturer un mandat que vous ne remplissez pas.`,`Sous la bande à ${pct(sp)} : le comité se demande ce que font vos analystes.`],8));
 if(inc)C.push(t([`${inc} incident${inc>1?'s':''} ce trimestre, placé${inc>1?'s':''} en tête du rapport, avant la performance.`,"L'incident a été discuté plus longtemps que le book. C'est ainsi que fonctionnent les comités.","Un incident, et c'est tout le dispositif de contrôle qui repasse à l'examen."],11));
 else if(S.rcD.some(x=>/2,2 σ/.test(x[0])))C.push(t(["La perte dépasse ce que votre propre modèle annonçait : la seule chose qu'un comité ne pardonne pas.","Le modèle est faux, ou le book n'était pas celui du rapport. Les deux hypothèses vous desservent."],10));

   <div class="regime">${R.nm}</div><div class="sub">${R.d}</div></div>

  <div class="block"><div class="blockhead"><h2>La concurrence</h2><span class="hint">${1+S.rivals.filter(r=>r.cum>S.idx).length}<sup>${(1+S.rivals.filter(r=>r.cum>S.idx).length)===1?'er':'e'}</sup> sur cinq</span></div>
   <table class="qt"><thead><tr><th>Fonds</th><th>Trim.</th><th>Cumul</th><th>vs vous</th></tr></thead><tbody>
   ${all.map(a=>{const c=cums.find(z=>z.nm===(a.me?S.fundName:a.nm.split(' · ')[0]));const dv=a.me?0:(c?c.v:0)-(S.idx-1);
     return `<tr class="${a.me?'me':''}"><td>${a.nm}</td><td class="${cls(a.v)}">${sgn(a.v,1)}</td><td class="${cls(c?c.v:0)}">${sgn(c?c.v:0,1)}</td><td class="${a.me?'':cls(-dv)}">${a.me?'—':(dv>=0?'+':'−')+Math.abs(dv*100).toFixed(1)+' pts'}</td></tr>`}).join('')}
   </tbody></table></div>

  <div class="block"><div class="blockhead"><h2>Du brut au net</h2><span class="hint">en % de l'encours</span></div>
   <div class="attr"><span class="an">Positions directionnelles</span><span class="av">${sgn(o.P.grossM/o.q0,2)} · ${inU(o.P.grossM,UQ)}</span></div>
   <div class="attr"><span class="an">Dépêches, incidents et desk</span><span class="av">${sgn((o.P.evM+o.P.incM)/o.q0,2)} · ${inU(o.P.evM+o.P.incM,UQ)}</span></div>
   <div class="attr"><span class="an">Rémunération du collatéral</span><span class="av">${sgn(o.P.collM/o.q0,2)} · ${inU(o.P.collM,UQ)}</span></div>
   <div class="attr"><span class="an">Coûts de transaction</span><span class="av">${sgn(o.P.tcM/o.q0,2)} · ${inU(o.P.tcM,UQ)}</span></div>
   <div class="attr"><span class="an">Frais de gestion et de performance</span><span class="av">${sgn(o.P.feeM/o.q0,2)} · ${inU(o.P.feeM,UQ)}</span></div>
   <div class="attr"><span class="an" style="color:var(--txt)">Résultat du trimestre</span><span class="av">${sgn(o.qTotal,2)} · ${inU(o.P.perfM,UQ)}</span></div>
   <div class="attr"><span class="an">Souscriptions et rachats</span><span class="av ${Math.abs(o.P.flowM)>1e-9?cls(o.P.flowM):''}">${Math.abs(o.P.flowM)>1e-9?inU(o.P.flowM,UQ):'aucun mouvement'}</span></div>
   ${S.poachMsg?`<div class="note" style="margin:4px 0 8px">${S.poachMsg}</div>`:''}<div class="attr"><span class="an">Encours en fin de trimestre</span><span class="av"><b>${moneyB(S.nav)}</b></span></div>
   <details style="margin-top:8px"><summary>Détails</summary><p class="note">Les pourcentages sont exprimés sur l'encours de début de trimestre (${moneyB(o.q0)}). Les dépêches, interactions et incidents ont été comptabilisés au fil du trimestre ; les positions, le collatéral et les frais le sont à la clôture. Les souscriptions et rachats sont des mouvements de capital : ils changent l'encours sans compter dans la performance.</p></details>
  </div>
  <div class="block"><div class="blockhead"><h2>Vos gains</h2><span class="hint">le score</span></div>
   <div class="attr"><span class="an">Net du trimestre</span><span class="av">${inU(S.mgrQ.fees-S.mgrQ.ops-S.mgrQ.rum,UG)}</span></div>
   <div class="attr"><span class="an" style="color:var(--txt)">Cumul depuis le début</span><span class="av"><b class="gold-g">${score(S.mgrFees-S.mgrCosts)}</b></span></div>
   <details style="margin-top:6px"><summary>Détail</summary>
    ${tbl([['Commission de gestion',inU(S.mgrQ.mgmt,UG)],['Commission de performance',inU(S.mgrQ.perf,UG)],[`Budget d'exploitation (${S.budBp} pb)`,inU(-S.mgrQ.ops,UG)],['Achat de sources',inU(-S.mgrQ.rum,UG)]])}</details>
  </div>
  <div class="block"><div class="blockhead"><h2>Ce qu'ils en disent</h2><span class="hint">${Math.round(S.lp)} · ${Math.round(S.rc)}</span></div>
   <div class="wire"><div class="kicker" style="margin-bottom:4px">LES INVESTISSEURS</div><p style="margin:0;color:var(--dim);font-size:13.5px">${V.inv}</p>
    <div class="kicker" style="margin:12px 0 4px">LE COMITÉ DES RISQUES</div><p style="margin:0;color:var(--dim);font-size:13.5px">${V.com}</p></div>
  </div>
  <div class="block"><div class="wire" style="border-color:var(--line2)">
   <div class="news" style="border:none;padding:0"><span class="src">${S.press[0].src.toUpperCase()}</span><span>${S.press[0].t}</span></div>
   <details style="margin-top:8px"><summary>${S.press.length-1} autres titres</summary>
    ${S.press.slice(1).map(h=>`<div class="news"><span class="src">${h.src.toUpperCase()}</span><span>${h.t}</span></div>`).join('')}</details></div>
  </div>
  <div class="block"><details><summary style="font-size:15px;color:var(--txt);font-weight:600">Ce qui s'est passé ce trimestre · ${gz(gT.lp,gT.rc,'always')}</summary>
   ${story.length?`<p class="note" style="margin:6px 0 8px">${story.map(x=>`• ${x}`).join('<br>')}</p>`:''}${tbl([...S.gLog.map(g=>[g.why,sd1(g.lp),sd1(g.rc)]),...S.lpD.map(x=>[x[0],sd1(x[1]),'']),...S.rcD.map(x=>[x[0],'',sd1(x[1])]),['<b>Total</b>',sd1(gT.lp),sd1(gT.rc)]],['Cause','Inv.','Com.'])}</details>
  </div>
  ${S.evLog.length?`<div class="block"><details><summary style="font-size:15px;color:var(--txt);font-weight:600">Le film du trimestre · ${S.evLog.length} épisodes</summary>
   ${tbl(S.evLog.map(e=>[e.t,`${sgn(e.pnl,1)} · ${mn(e.m)}`,gz(e.lp,e.rc,'always')]),['Épisode','Profit / perte','Effets'])}</details></div>`:''}
  ${S.comm&&S.comm.ret!==null?`<div class="block"><details><summary style="font-size:15px;color:var(--txt);font-weight:600">Votre engagement · ${S.commRes&&S.commRes.ok?'<span class="pos-g">tenu</span>':'<span class="neg-g">manqué</span>'}</summary>
   <div class="attr"><span class="an">Rendement promis</span><span class="av">≥ ${sgn(S.comm.ret,1)}</span></div>
   <div class="attr"><span class="an">Rendement livré</span><span class="av ${S.commRes&&S.commRes.ok?'pos-g':'neg-g'}">${sgn(S.rets[S.rets.length-1]||0,1)} · ${S.commRes&&S.commRes.ok?'tenu':'manqué'}</span></div>
  </details></div>`:''}
  <div class="block"><details><summary style="font-size:15px;color:var(--txt);font-weight:600">D'où vient la performance · décomposition factorielle</summary>${att}</details></div>
  ${lines.length?`<div class="block"><details><summary style="font-size:15px;color:var(--txt);font-weight:600">Par marché · rendement et contribution</summary>${byl}</details></div>`:''}  <button class="cta" id="nx">${S.over?'Voir le rapport final':(S.q>=QT()?`Clôturer les ${DUR().ans} an${DUR().ans>1?'s':''}`:'Trimestre suivant')}</button></div>`;
 document.getElementById('nx').onclick=()=>{
  if(S.over||S.q>=QT()){screenFinal();window.scrollTo(0,0);return}
  if(rng()<0.42&&BOARDEV.filter(e=>!S.usedEv.includes(e.t)).length){screenBoard();window.scrollTo(0,0)}
  else{planQuarter();phaseOpen()}
 };
}
function screenBoard(){
 hint('board');
 save('screenBoard');
 const av=BOARDEV.filter(e=>!S.usedEv.includes(e.t));
 const ev=pick(av);S.usedEv.push(ev.t);
 app.innerHTML=statusBar(true)+`<div class="evwrap fade">
  <div class="evcard">${evHead(ev.who,'inv')}<h3>${ev.t}</h3><p>${ev.p}</p>${evTimerHTML}</div>
  ${ev.ch.map((c,i)=>`<button class="choice" data-i="${i}"><b>${c.b}</b><span>${c.s}</span></button>`).join('')}</div>`;
 const pickB=idx=>{clearTimer();
  const e=ev.ch[idx].e;
  if(e.lp)S.lp=Math.max(0,Math.min(100,S.lp+e.lp));
  if(e.rc)S.rc=Math.max(0,Math.min(100,S.rc+e.rc));
  if(e.aum){S.flows=(S.flows||0)+e.aum*S.nav;S.nav*=(1+e.aum)}
  if(e.cash)S.nav*=(1+e.cash);
  if(e.tgt)S.tgt=e.tgt;
  ['carry','noise','flighty','leak'].forEach(f=>{if(e[f])S[f]=true});
  if(e.cut)e.cut.forEach(s=>{const i=IDX[s];const d=Math.trunc(S.k[i]/2)-S.k[i];
    if(d)  {const t=tcost(d,i);S.totalTC+=t.cost;S.nav-=t.cost}
    S.k[i]=Math.trunc(S.k[i]/2)});
  planQuarter();phaseOpen();
 };
 app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pickB(+b.dataset.i));
 armTimer(()=>pickB(ev.ch.length-1));

}

/* ---------- rapport final ---------- */
function normCdf(x){const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2);
 let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}
function screenFinal(){
 clearSave();
 const r=S.rets,n=r.length,mu=r.reduce((a,b)=>a+b,0)/n;
 const sd=Math.sqrt(r.reduce((a,b)=>a+(b-mu)**2,0)/Math.max(1,n-1));
 const srQ=sd>1e-9?mu/sd:0,sr=srQ*2;
 const tot=S.idx,cagr=Math.pow(Math.max(tot,0.01),4/n)-1,volA=sd*2;
 const m3=r.reduce((a,b)=>a+(b-mu)**3,0)/n/Math.pow(sd||1,3);
 const m4=r.reduce((a,b)=>a+(b-mu)**4,0)/n/Math.pow(sd||1,4);
 const den=Math.sqrt(Math.max(1e-6,1-m3*srQ+(m4-1)/4*srQ*srQ));
 const psr=n>2?normCdf(srQ*Math.sqrt(n-1)/den):0.5;
 const seSR=Math.sqrt((1+srQ*srQ/2)/Math.max(1,n-1))*2;
 const rank=1+S.rivals.filter(x=>x.cum>tot).length;
 S.finalCtx={over:S.over,rank,cagr,tot,gains:S.mgrFees-S.mgrCosts,maxdd:S.maxdd,q:S.q,idx:S.idx,psr,
  inc:S.incidents.length,rum:S.rumBought||0,outBand:!!S.outBand,mc:!!S.everMarginCall,
  size:S.size,univ:S.univ,dur:S.dur,goals:S.goalsWon||0,sweeps:S.sweeps||0,
  commNone:S.commNone||0,qNeg:S.qNeg||0,mguMax:S.mguMax||0};
 FEATS.forEach(f=>{if(f.tf){try{if(f.tf(S.finalCtx))award(f.id)}catch(e){}}});
 let verdict,vtxt;
 if(S.over==='dd'){verdict="Le fonds est liquidé";vtxt=`La perte a dépassé 28 %. Les clauses de rachat se sont déclenchées en cascade au trimestre ${S.q}.`}
 else if(S.over==='lp'){verdict="Les rachats l'ont emporté";vtxt="La base d'investisseurs s'est vidée avant que la thèse n'ait le temps de se réaliser. C'est la façon la plus courante de perdre en gestion."}
 else if(S.over==='rc'){verdict="Vous êtes remercié";vtxt="Le comité des risques a retiré le mandat. Le book pouvait être bon ; il n'était pas défendable."}
 else if(cagr>0.18&&S.maxdd<0.15&&rank===1){verdict="Deux années de référence";vtxt="Performance, discipline de risque, et vous avez battu les quatre. Reste à savoir ce qui, là-dedans, se reproduira."}
 else if(cagr>0.12&&S.maxdd<0.20){verdict="Mandat renouvelé";vtxt="Vous tenez l'objectif dans les limites. Les investisseurs resignent pour trois ans."}
 else if(cagr>0.03){verdict="Vous survivez";vtxt="Assez pour continuer, pas assez pour lever. Le fonds reste sous-dimensionné pour ses ambitions."}
 else if(cagr>-0.05){verdict="Deux ans pour rien";vtxt="Frais payés, risque pris, rien produit. Les allocataires appellent ça un coût d'option."}
 else{verdict="Sous l'eau";vtxt="Le plus haut historique est loin au-dessus. Vous travaillerez sans commission de performance jusqu'à le retrouver."}
 const W=340,H=120,pad=5;
 const series=[S.navs.map(v=>v/100),...S.rivals.map(rv=>{let c=[1];S.rets.forEach((_,i)=>c.push(c[i]*(1+(rv.hist?rv.hist[i]:0))));return c})];
 const lo=Math.min(...S.navs)/100*0.99,hi=Math.max(...S.navs)/100*1.01;
 const px=i=>pad+i*(W-2*pad)/Math.max(1,S.navs.length-1),py=v=>H-pad-(v-lo)/(hi-lo||1)*(H-2*pad);
 const pts=S.navs.map((v,i)=>`${px(i).toFixed(1)},${py(v/100).toFixed(1)}`).join(' ');
 const qrows=S.rets.map((x,i)=>`<tr><td>T${i+1}</td><td style="text-align:left">${REG[S.regimes[i]].nm}</td><td class="${cls(x)}">${sgn(x,1)}</td><td>${moneyB(S.navs[i+1])}</td></tr>`).join('');
 const lg=[{nm:S.fundName,v:S.idx-1,me:1},...S.rivals.map(x=>({nm:x.nm+' · '+x.boss,v:x.cum-1}))].sort((a,b)=>b.v-a.v);
 app.innerHTML=`<div class="fade" style="padding-top:24px">
  <div class="kicker">${S.fundName.toUpperCase()} · RAPPORT AUX INVESTISSEURS · ${S.q} TRIMESTRE${S.q>1?'S':''}</div>
  <h1 class="verdict">${verdict}</h1>
  <p class="prose" style="margin-top:12px">${vtxt}</p>
  <svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
   <line x1="0" y1="${py(1)}" x2="${W}" y2="${py(1)}" stroke="#35496A" stroke-width="1" stroke-dasharray="3 3"/>
   <polyline points="${pts}" fill="none" stroke="${tot>=1?'#4FA98C':'#C4576F'}" stroke-width="2" stroke-linejoin="round"/></svg>
  <div class="grid2">
   <div class="cell"><div class="cl">Performance nette annualisée</div><div class="cv ${cls(cagr)}">${sgn(cagr,1)}</div></div>
   <div class="cell"><div class="cl">Volatilité réalisée</div><div class="cv">${pct(volA,1)}</div></div>
   <div class="cell"><div class="cl">Perte maximale</div><div class="cv neg-g">−${(S.maxdd*100).toFixed(1)} %</div></div>
   <div class="cell"><div class="cl">Ratio de Sharpe annualisé</div><div class="cv ${sr>=0?'':'neg-g'}">${sr.toFixed(2).replace('-','−')}</div></div>
   <div class="cell"><div class="cl">Coûts de transaction payés</div><div class="cv">${moneyB(S.totalTC)}</div></div>
   <div class="cell"><div class="cl">Budget d'exploitation payé</div><div class="cv">${moneyB(S.totalOps)}</div></div>
   <div class="cell"><div class="cl">Encours final</div><div class="cv">${moneyB(S.nav)}</div></div>
   <div class="cell" style="background:linear-gradient(180deg,rgba(217,176,106,.14),rgba(217,176,106,.03))"><div class="cl" style="color:var(--gold)">Vos gains de gérant</div><div class="cv" style="color:var(--gold)">${score(S.mgrFees-S.mgrCosts)}</div></div>
   <div class="cell"><div class="cl">Classement sur cinq fonds</div><div class="cv">${rank}<sup style="font-size:12px">${rank===1?'er':'e'}</sup></div></div>
  </div>
  <div class="block"><div class="blockhead"><h2>Classement final</h2><span class="hint">performance cumulée</span></div>
   <table class="qt"><tbody>${lg.map((a,i)=>`<tr class="${a.me?'me':''}"><td>${i+1}. ${a.nm}</td><td class="${cls(a.v)}">${sgn(a.v,1)}</td></tr>`).join('')}</tbody></table></div>
  <div class="block"><div class="blockhead"><h2>Trimestre par trimestre</h2><span class="hint">net · encours</span></div>
   <table class="qt"><thead><tr><th>Trim.</th><th style="text-align:left">Régime réalisé</th><th>Net</th><th>Encours</th></tr></thead><tbody>${qrows}</tbody></table></div>
  ${S.incidents.length?`<div class="block"><div class="blockhead"><h2>Incidents</h2><span class="hint">${S.incidents.length}</span></div>
   ${S.incidents.map(x=>`<div class="attr"><span class="an">${x.t}</span><span class="av neg-g">${sgn(-x.loss,2)}</span></div>`).join('')}</div>`:''}
  <div class="psr"><h2 style="font-size:15px">Ce que ces chiffres prouvent</h2>
   <p>Sur ${n} observations trimestrielles, l'écart-type d'estimation de votre Sharpe annualisé est d'environ <b class="num">±${seSR.toFixed(2)}</b>. Votre Sharpe probabiliste — la probabilité que le vrai Sharpe soit strictement positif, corrigée de l'asymétrie et de l'épaisseur des queues — ressort à <b class="num">${(psr*100).toFixed(0)} %</b>.</p>
   <p>${psr>0.95?"Au-delà de 95 %, c'est le seuil habituellement retenu pour dire qu'un historique contient autre chose que du bruit. Vous y êtes — sur huit points, ce qui reste très peu.":"En dessous de 95 %, un allocataire sérieux ne peut pas distinguer votre compétence de la chance. C'est vrai de la quasi-totalité des historiques de deux ans, y compris les bons."}</p>
   <div class="f">PSR = Φ[ ŜR·√(n−1) / √(1 − γ₃·ŜR + (γ₄−1)/4·ŜR²) ]<br>n = ${n} · ŜR<sub>trim</sub> = ${srQ.toFixed(3)} · γ₃ = ${m3.toFixed(2)} · γ₄ = ${m4.toFixed(2)}</div></div>
  <div class="block"><div class="blockhead"><h2>Hauts faits de la partie</h2><span class="hint">${FEATS.filter(f=>S.fl[f.id]).length} débloqués</span></div>
   <div class="feats">${FEATS.filter(f=>S.fl[f.id]).map(f=>`<div class="feat on"><span class="fic">${f.ic}</span><b>${f.nm}</b><span class="fd">${f.d}</span></div>`).join('')||'<p class="note">Aucun cette fois.</p>'}</div></div>
  <button class="cta gold" id="share">Partager ce résultat</button>
  <button class="cta ghost" id="hall2">Palmarès et hauts faits</button>
  <button class="cta" id="again">Rejouer avec d'autres choix</button>
  <button class="cta ghost" id="same">Rejouer la même configuration (graine ${S.seed})</button></div>`;
 recordRun({verdict,cagr,rank});
 document.getElementById('hall2').onclick=()=>screenHall(screenFinal);
 document.getElementById('share').onclick=async()=>{
  const txt=`${S.fundName} — ${verdict}. ${score(S.mgrFees-S.mgrCosts)} de gains de gérant, ${sgnp(cagr,1)} net annualisés sur ${n} trimestre${n>1?'s':''}, ${rank}${rank===1?'er':'e'} sur 5, perte max −${(S.maxdd*100).toFixed(1)} %, Sharpe ${sr.toFixed(2)}. Profil ${PROF().nm.toLowerCase()}, ${VOL().nm.toLowerCase()}. Graine ${S.seed} — faites mieux : ${location.href.split('#')[0]}`;
  const b=document.getElementById('share');
  try{if(navigator.share){await navigator.share({title:'Le Book',text:txt});return}}catch(e){}
  try{await navigator.clipboard.writeText(txt);b.textContent='Résultat copié — collez-le où vous voulez'}catch(e){prompt('Copiez ce texte :',txt)}
 };
 document.getElementById('again').onclick=()=>{setup={prof:'syst',arch:'std',desk:'inhouse',vol:'std',size:'mid'};screenSetup();window.scrollTo(0,0)};
 document.getElementById('same').onclick=()=>{newGame(S.seed,S.prof,S.arch,S.desk,S.vol,S.size);phaseOpen()};
}
if(!(hasSave()&&location.hash==='#resume'))screenIntro();else loadGame();
</script>
</body></html>
